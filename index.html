<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUDRAKSH CBT EXAMINATION</title>
<style>
:root{--navy:#123765;--blue:#2667dc;--bg:#f4f7fb;--card:#fff;--border:#d9e2ef;--text:#13243f;--muted:#65748e;--good:#157347;--warn:#9a6500;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{background:var(--navy);color:#fff;min-height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:20}.brand{font-size:22px;font-weight:800}.container{max-width:1280px;margin:0 auto;padding:24px 18px 56px}.hero{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:0 8px 24px rgba(18,55,101,.06)}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(18,55,101,.05);margin-top:16px}.login-card{max-width:460px;margin:56px auto}.muted{color:var(--muted)}.small{font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tab{border:1px solid var(--border);background:#fff;color:var(--navy);padding:9px 13px;border-radius:9px}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:#edf2f8;color:var(--navy)}.btn.warn{background:#fff3d6;color:#805400}.btn.danger{background:#ffe6e2;color:var(--danger)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.sm{padding:7px 10px;font-size:12px}.row{display:flex;align-items:center}.gap{gap:9px}.between{justify-content:space-between}.top16{margin-top:16px}.top20{margin-top:20px}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{width:100%;margin-top:7px;border:1px solid var(--border);border-radius:9px;padding:10px 11px;background:#fff;color:var(--text)}textarea{min-height:100px;resize:vertical}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{margin-top:0}.stat strong{font-size:32px;display:block;margin-top:7px}.notice{background:#fff8dc;border:1px solid #eed17f;border-radius:10px;padding:13px 14px}.success{background:#e9f7ef;border:1px solid #9bd0af;color:#155f39;border-radius:10px;padding:13px 14px}.error{background:#ffeded;border:1px solid #e4a3a3;color:#7b1f1f;border-radius:10px;padding:13px 14px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:11px;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:#f7f9fc}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f8;color:var(--navy);font-size:12px;font-weight:700}.badge.good{background:#e6f6ed;color:var(--good)}.badge.warn{background:#fff3d6;color:var(--warn)}.empty{padding:24px;text-align:center;color:var(--muted)}.pick-list{max-height:460px;overflow:auto;border:1px solid var(--border);border-radius:10px}.pick{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:500}.pick input{width:auto;margin-top:3px}.toolbar{margin-top:12px}.exam-head{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px}.timer{font-size:28px;font-weight:800;color:var(--navy)}.exam-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.question-text{font-size:21px;line-height:1.55;font-weight:700}.options{display:grid;gap:10px;margin-top:18px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:13px;border-radius:11px;font-weight:500}.option input{width:auto;margin-top:4px}.option.selected{background:#edf4ff;border-color:#6d9af1}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:11px}.qnum{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px}.qnum.current{outline:2px solid var(--blue)}.qnum.visited{background:#f4f6f9;border-color:#c8d0dc}.qnum.visited{background:#f4f6f9;border-color:#c8d0dc}.qnum.visited{background:#f4f6f9;border-color:#c8d0dc}.qnum.answered{background:#e5f5ec;border-color:#8fc9aa}.qnum.review{background:#fff3d6;border-color:#e0bd6a} .legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.result-value{font-size:28px;font-weight:800;margin-top:5px}.detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.result-value{font-size:28px;font-weight:800;margin-top:5px}.detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.progressbar{height:10px;border-radius:999px;background:#edf2f8;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--blue)}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.exam-grid{grid-template-columns:1fr}.brand{font-size:18px}.topbar{padding:0 14px}}

.preview-text{white-space:pre-wrap;line-height:1.45}.preview-options{line-height:1.45}.report-question{border:1px solid #dbe3ef;border-radius:10px;padding:16px;margin-top:14px;background:#fff}
.report-question-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.report-qnum{font-weight:800;min-width:46px}.report-status{font-weight:800}
.report-options{display:grid;gap:8px;margin-top:13px}
.report-option{border:1px solid #dbe3ef;border-radius:8px;padding:10px 12px;background:#fafbfd}
.report-option.selected{border:2px solid #f0b429;background:#fff8e7}
.report-option.correct{border:2px solid #36a269;background:#edf9f2}
.report-option.selected.correct{border:2px solid #36a269;background:#edf9f2}
.report-option .tag{float:right;font-size:12px;font-weight:700;margin-left:8px}
.report-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.report-meta-box{border:1px solid #e1e7ef;border-radius:8px;padding:10px;background:#f8fafc}
@media(max-width:800px){.report-meta{grid-template-columns:repeat(2,1fr)}.report-question-head{display:block}} 

/* Final UI polish v1 — preserve First Edition layout, improve hierarchy and mobile use */
.stat{padding:18px 20px}.stat .muted{font-weight:600;font-size:13px}.stat strong{line-height:1}
.hero{box-shadow:0 8px 24px rgba(18,55,101,.06)}
.tab,.btn{transition:transform .16s ease,filter .16s ease}.tab:hover,.btn:hover:not(:disabled){transform:translateY(-1px)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(38,103,220,.18);border-color:#6d9af1}
table tbody tr:hover{background:#fbfdff}
th{font-size:13px;white-space:nowrap}.report-option{line-height:1.45}.report-meta-box b{display:inline-block;margin-top:2px}
.exam-head{position:sticky;top:0;z-index:10;box-shadow:0 6px 18px rgba(18,55,101,.05)}
.exam-grid aside.card{position:sticky;top:86px;height:max-content}
@media(max-width:900px){.container{padding:16px 12px 40px}.hero{padding:18px}.hero h1{font-size:26px}.card{padding:16px}.exam-grid aside.card{position:static}.brand{font-size:18px}}
@media(max-width:620px){.topbar{min-height:56px;padding:0 10px}.brand{font-size:15px}.container{padding:12px 9px 32px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px}.stat strong{font-size:27px}.tabs{gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;padding:8px 10px;font-size:13px}.section-title{align-items:flex-start;flex-direction:column}.question-text{font-size:18px}.option{padding:11px}.timer{font-size:22px}.palette{gap:5px}.qnum{padding:7px 4px}table{min-width:720px}.report-meta{grid-template-columns:repeat(2,1fr)}}

</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
const { createClient } = window.supabase;
const cfg = window.RUDRAKSH_CONFIG || {};
const app = document.getElementById('app');
const ready = typeof cfg.SUPABASE_URL === 'string' && cfg.SUPABASE_URL.startsWith('https://') && typeof cfg.SUPABASE_ANON_KEY === 'string' && cfg.SUPABASE_ANON_KEY.startsWith('sb_');
const sb = ready ? createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
let user=null, profile=null, timer=null;
const state={tab:'dashboard',teacher:{questions:[],tests:[],students:[],reports:[]},student:{tests:[],progress:[],attemptAnswers:{}},attempt:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v).toLocaleString():'—';
const money=v=>Number(v||0).toFixed(2);const fmtSeconds=s=>{s=Math.max(0,Math.floor(Number(s||0)));const hh=Math.floor(s/3600),mm=Math.floor((s%3600)/60),ss=s%60;return hh?`${hh}h ${String(mm).padStart(2,'0')}m ${String(ss).padStart(2,'0')}s`:`${mm}m ${String(ss).padStart(2,'0')}s`;};
const btn=(t,id='',k='primary',x='')=>`<button class="btn ${k}" id="${id}" ${x}>${t}</button>`;
const shell=(title,subtitle,body,actions='')=>`<header class="topbar"><div class="brand">RUDRAKSH CBT EXAMINATION</div><div>${actions}</div></header><main class="container"><section class="hero"><h1>${esc(title)}</h1><p>${esc(subtitle||'Professional online CBT management system')}</p></section>${body}</main>`;
const empty=t=>`<div class="empty">${esc(t)}</div>`;
async function boot(){if(!ready)return setupScreen();const {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(!user)return loginScreen();await loadProfile();}
function setupScreen(){app.innerHTML=shell('Online setup required','The website is online, but Supabase configuration is missing.',`<section class="card"><div class="notice"><b>One-time setup:</b> update <code>config.js</code> with the Supabase Project URL and Publishable key.</div></section>`);}
function loginScreen(message=''){app.innerHTML=shell('Secure Login','Teacher and Student access',`<section class="card login-card"><h2>Sign in</h2><p class="muted">Use your registered email and password.</p>${message?`<div class="error">${esc(message)}</div>`:''}<label>Email address<input id="email" type="email" autocomplete="username" placeholder="Teacher / Student email"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Password"></label><div class="row gap top16">${btn('Sign in','loginBtn')}</div><p id="loginMsg" class="muted small"></p></section>`);document.getElementById('loginBtn').onclick=login;}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('loginMsg');if(!email||!password){msg.textContent='Enter email and password.';return;}msg.textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;return;}user=data.user;await loadProfile();}
async function loadProfile(){const {data:p,error}=await sb.from('profiles').select('id,role,full_name,user_code').eq('id',user.id).single();if(error||!p){loginScreen('Your account exists, but its profile is not ready.');return;}profile=p;state.tab='dashboard';renderApp();}
async function saveProfile(){const name=document.getElementById('profileName')?.value.trim(),msg=document.getElementById('profileMsg');if(!name){if(msg)msg.textContent='Please enter your name.';return;}if(msg)msg.textContent='Saving…';const {data,error}=await sb.rpc('update_my_profile_name',{p_full_name:name});if(error){if(msg)msg.textContent=`Could not save name: ${error.message}`;return;}profile=Array.isArray(data)?data[0]:data;if(msg)msg.textContent='Profile saved successfully.';await renderApp();}
async function logout(){clearInterval(timer);await sb.auth.signOut();user=null;profile=null;state.attempt=null;loginScreen();}
function nav(items){return `<nav class="tabs">${items.map(([k,l])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</nav>`;}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{state.tab=b.dataset.tab;try{await renderApp();}catch(e){console.error(e);app.innerHTML=shell(profile.role==='teacher'?'Teacher Dashboard':'Student Dashboard',`Welcome, ${profile.full_name||'User'} · ${profile.user_code||''}`,`<section class="card"><div class="notice">Unable to load this section right now. ${esc(e.message||e)}</div></section>`,btn('Logout','logout','secondary'));document.getElementById('logout')?.addEventListener('click',logout);}});const l=document.getElementById('logout');if(l)l.onclick=logout;const p=document.getElementById('changePw');if(p)p.onclick=changePassword;document.getElementById('saveProfile')?.addEventListener('click',saveProfile);}
async function renderApp(){if(profile.role==='teacher')return renderTeacher();return renderStudent();}
async function renderTeacher(){const [q,t,s,r]=await Promise.all([sb.from('questions').select('id,subject,chapter,topic,source_name,source_question_number,question_text,marks,negative_marks,created_at').eq('is_active',true).order('created_at',{ascending:false}),sb.from('tests').select('id,title,duration_minutes,default_negative_marks,is_published,created_at').order('created_at',{ascending:false}),sb.from('profiles').select('id,user_code,full_name,role').eq('role','student').order('full_name'),sb.from('teacher_attempt_report').select('*').order('submitted_at',{ascending:false}),sb.from('question_answers').select('question_id,correct_option')]);const amap=new Map((a.data||[]).map(x=>[x.question_id,x.correct_option]));(q.data||[]).forEach(x=>x.correct_option=amap.get(x.id)||null);state.teacher.questions=q.data||[];state.teacher.tests=t.data||[];state.teacher.students=s.data||[];state.teacher.reports=r.data||[];let body=nav([['dashboard','Dashboard'],['questions','Question Bank'],['import','Import Questions'],['tests','Create Test'],['students','Students'],['reports','Performance'],['account','My Account']]);if(state.tab==='dashboard')body+=teacherDashboard();if(state.tab==='questions')body+=teacherQuestions();if(state.tab==='import')body+=teacherImport();if(state.tab==='tests')body+=teacherTests();if(state.tab==='students')body+=teacherStudents();if(state.tab==='reports')body+=teacherReports();if(state.tab==='reportdetail')body+=teacherReportDetail();if(state.tab==='account')body+=accountPanel();app.innerHTML=shell('Teacher Dashboard',`Welcome, ${profile.full_name||'Teacher'} · ${profile.user_code||'T001'}`,body,btn('Logout','logout','secondary'));bindTabs();bindTeacher();}
function teacherDashboard(){return `<section class="stats"><div class="card stat"><div class="muted">Questions</div><strong>${state.teacher.questions.length}</strong></div><div class="card stat"><div class="muted">Tests</div><strong>${state.teacher.tests.length}</strong></div><div class="card stat"><div class="muted">Students</div><strong>${state.teacher.students.length}</strong></div><div class="card stat"><div class="muted">Submitted Attempts</div><strong>${state.teacher.reports.length}</strong></div></section><section class="card"><h2>Teacher Control Center</h2><div class="grid2"><div><b>1.</b> Import or add questions</div><div><b>2.</b> Verify private answer keys</div><div><b>3.</b> Create 180–300+ question tests</div><div><b>4.</b> Assign tests to students</div><div><b>5.</b> Monitor detailed performance</div><div><b>6.</b> Keep every attempt recorded</div></div><div class="notice top16">The production question bank starts with <b>0 questions</b>. Only teacher-added/imported questions become part of the system.</div></section>`;}
function teacherQuestions(){return `<section class="card"><div class="section-title"><div><h2>Question Bank</h2><p class="muted">Search, review and organize the complete question bank.</p></div><div class="row gap"><button class="btn danger" id="deleteAllQuestions" type="button">Delete All Questions</button><button class="btn primary" data-tab="import">Import Questions</button></div></div><div class="toolbar"><input id="qSearch" placeholder="Search question / subject / chapter / topic / source"></div><div id="qTable" class="table-wrap"></div></section>`;}
function renderQuestionTable(filter=''){const rows=state.teacher.questions.filter(q=>[q.question_text,q.subject,q.chapter,q.topic,q.source_name,q.source_question_number].join(' ').toLowerCase().includes(filter.toLowerCase()));return `<table><thead><tr><th>No.</th><th>Subject</th><th>Chapter</th><th>Topic</th><th>Source</th><th>Question</th><th>Status</th><th>Manage</th></tr></thead><tbody>${rows.map(q=>{const pending=!q.correct_option;return `<tr><td>${esc(q.source_question_number||'—')}</td><td>${esc(q.subject)}</td><td>${esc(q.chapter||'')}</td><td>${esc(q.topic||'')}</td><td>${esc(q.source_name||'')}</td><td>${esc(q.question_text)}</td><td>${pending?'<span class="badge warn">Answer Pending</span>':'<span class="badge good">Ready</span>'}</td><td>${pending?`<button class="btn secondary sm" data-set-answer="${q.id}">Set Answer</button> `:''}<button class="btn danger sm" data-delete-question="${q.id}">Delete</button></td></tr>`}).join('')||`<tr><td colspan="8">${empty('No questions found.')}</td></tr>`}</tbody></table>`;}
async function deleteQuestion(questionId){const q=state.teacher.questions.find(x=>x.id===questionId);if(!q)return;if(!confirm(`Delete this question?\n\n${q.question_text}\n\nThis will remove it from the active Question Bank.`))return;const {error}=await sb.from('questions').update({is_active:false}).eq('id',questionId);if(error){alert(`Could not delete the question.\n\n${error.message}`);return;}await renderTeacher();}
async function setQuestionAnswer(questionId){const q=state.teacher.questions.find(x=>x.id===questionId);if(!q)return;const v=(prompt(`Correct answer for Question ${q.source_question_number||''}: enter A, B, C or D.`)||'').trim().toUpperCase();if(!v)return;if(!/^[ABCD]$/.test(v)){alert('Please enter only A, B, C or D.');return;}const {error}=await sb.from('question_answers').upsert({question_id:questionId,correct_option:v},{onConflict:'question_id'});if(error){alert(`Could not save answer.\n\n${error.message}`);return;}await renderTeacher();}
function teacherImport(){return `<section class="card"><h2>Import Questions</h2><p class="muted">The answer key is optional. Without it, questions are stored as <b>Answer Pending</b> and can be completed later.</p><div class="grid2"><label>Question file <span class="muted small">(optional for answer-key-only update)</span><input id="qFile" type="file" accept=".pdf,.docx,.xlsx,.xls,.csv,.txt"></label><label>Answer key <span class="muted small">(optional for new questions)</span><input id="aFile" type="file" accept=".pdf,.docx,.xlsx,.xls,.csv,.txt"></label><label>Subject<input id="impSubject" placeholder="e.g. Biology"></label><label>Class / Exam<input id="impExam" placeholder="e.g. NCERT Class XI"></label><label>Chapter<input id="impChapter" placeholder="Optional"></label><label>Topic<input id="impTopic" placeholder="Optional"></label><label style="grid-column:1/-1">Existing Question Source <span class="muted small">(for answer-key-only update)</span><input id="impSourceMatch" placeholder="e.g. neet_biology_mcqs.pdf"></label></div><div class="row gap top16"><button class="btn primary" id="previewImport">Preview Questions</button><button class="btn secondary" id="clearImport">Clear</button></div><div id="importPreview" class="top16"></div></section>`;}
async function bindTeacher(){document.querySelectorAll('[data-delete-test]').forEach(b=>b.onclick=()=>deleteTest(b.dataset.deleteTest));document.querySelectorAll('[data-teacher-report]').forEach(b=>b.onclick=()=>openTeacherReport(b.dataset.teacherReport));document.getElementById('backTeacherReports')?.addEventListener('click',()=>{state.tab='reports';renderTeacher();});document.querySelectorAll('[data-teacher-report]').forEach(b=>b.onclick=()=>openTeacherReport(b.dataset.teacherReport));document.getElementById('backTeacherReports')?.addEventListener('click',()=>{state.tab='reports';renderTeacher();});document.getElementById('qSearch')?.addEventListener('input',e=>{const box=document.getElementById('qTable');if(box)box.innerHTML=renderQuestionTable(e.target.value);bindQuestionDeleteButtons();});const qt=document.getElementById('qTable');if(qt){qt.innerHTML=renderQuestionTable();bindQuestionDeleteButtons();}document.getElementById('previewImport')?.addEventListener('click',previewImport);document.getElementById('clearImport')?.addEventListener('click',()=>renderApp());document.getElementById('createTest')?.addEventListener('click',createTest);const syncSelection=()=>{const boxes=[...document.querySelectorAll('.tq')],checked=boxes.filter(x=>x.checked).length,all=document.getElementById('selectAllQuestions'),count=document.getElementById('selectedQuestionCount');if(count)count.textContent=`${checked} selected`;if(all){all.checked=boxes.length>0&&checked===boxes.length;all.indeterminate=checked>0&&checked<boxes.length;}};document.getElementById('selectAllQuestions')?.addEventListener('change',e=>{document.querySelectorAll('.tq').forEach(x=>x.checked=e.target.checked);syncSelection();});document.getElementById('clearQuestionSelection')?.addEventListener('click',()=>{document.querySelectorAll('.tq').forEach(x=>x.checked=false);syncSelection();});document.querySelectorAll('.tq').forEach(x=>x.addEventListener('change',syncSelection));syncSelection();}
async function deleteAllQuestions(){if(!state.teacher.questions.length){alert('There are no active questions to delete.');return;}if(!confirm(`Delete ALL ${state.teacher.questions.length} questions from the active Question Bank?\n\nThis cannot be undone from the Question Bank.`))return;const btn=document.getElementById('deleteAllQuestions');if(btn){btn.disabled=true;btn.textContent='Deleting…';}const {error}=await sb.from('questions').update({is_active:false}).eq('is_active',true);if(error){if(btn){btn.disabled=false;btn.textContent='Delete All Questions';}alert(`Could not delete all questions.\n\n${error.message}`);return;}await renderTeacher();}
function bindQuestionDeleteButtons(){document.querySelectorAll('[data-delete-question]').forEach(b=>b.onclick=()=>deleteQuestion(b.dataset.deleteQuestion));document.querySelectorAll('[data-set-answer]').forEach(b=>b.onclick=()=>setQuestionAnswer(b.dataset.setAnswer));}

async function readFile(file){
  const ext=file.name.toLowerCase().split('.').pop();
  if(ext==='txt'||ext==='csv')return await file.text();
  if(ext==='docx'){const b=await file.arrayBuffer();return (await window.mammoth.extractRawText({arrayBuffer:b})).value;}
  if(ext==='xlsx'||ext==='xls'){const b=await file.arrayBuffer(),wb=XLSX.read(b,{type:'array'});return wb.SheetNames.map(n=>XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n');}
  if(ext==='pdf'){
    const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
    const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const all=[];
    for(let i=1;i<=pdf.numPages;i++) all.push(...await pdfPageToLines(pdf,i));
    return all.join('\n');
  }
  throw new Error('Unsupported file type');
}
function cleanPdfLine(s){return String(s||'').replace(/\u00ad/g,'').replace(/[ \t]+/g,' ').replace(/\s+([,.;:!?])/g,'$1').trim();}
function isPdfNoise(line){
  const s=cleanPdfLine(line),l=s.toLowerCase(); if(!s)return true;
  return /^npt[-_\s]/i.test(s)||l.includes('the radiant academy')||l.includes('corporate office')||l.includes('mob.no')||l.includes('website :')||l.includes('e-mail :')||/^section\s*[–-]/i.test(s)||/^straight objective type$/i.test(s)||/^this section contains\b/i.test(s)||/^course\s*:/i.test(s)||/^target\s*:/i.test(s)||/^time:\s*\d/i.test(s)||/^maximum marks\b/i.test(s)||/^instructions for candidates$/i.test(s)||/^atomic masses\s*:/i.test(s)||/^date\s*$/i.test(s);
}
async function pdfPageToLines(pdf,pageNum){
  const p=await pdf.getPage(pageNum),tc=await p.getTextContent({includeMarkedContent:false});
  const rows=[],tol=3.25;
  for(const it of (tc.items||[])){
    const str=cleanPdfLine(it.str); if(!str)continue;
    const x=Number(it.transform?.[4]||0),y=Number(it.transform?.[5]||0);
    let row=rows.find(r=>Math.abs(r.y-y)<=tol); if(!row){row={y,items:[]};rows.push(row);} row.items.push({x,str});
  }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()).filter(s=>!isPdfNoise(s));
}
function parseAnswerKey(text){
  const ans={}, raw=String(text||'');
  const n=raw.replace(/\r/g,' ').replace(/\n/g,' ').replace(/\s+/g,' ').trim();
  const blocks=[...n.matchAll(/QUES\s+([0-9\s]+?)\s+ANS\s+([ABCD1-4\s]+)/gi)];
  for(const m of blocks){const nums=(m[1].match(/\d+/g)||[]).map(Number),vals=(m[2].toUpperCase().match(/[ABCD]|[1-4]/g)||[]);nums.forEach((q,i)=>{const v=vals[i];if(v)ans[q]=/^[1-4]$/.test(v)?'ABCD'[Number(v)-1]:v;});}
  for(const line of raw.split(/\n+/)){const s=cleanPdfLine(line);for(const m of s.matchAll(/(?:Q(?:UES|uestion)?\.?\s*)?(\d{1,4})\s*[:.-]?\s*[\(\[]?([ABCD1-4])[\)\]]?/gi)){const v=m[2].toUpperCase();ans[Number(m[1])]=/^[1-4]$/.test(v)?'ABCD'[Number(v)-1]:v;}}
  return ans;
}
function normalizeOptionLabel(v){const s=String(v||'').toUpperCase();return /^[1-4]$/.test(s)?'ABCD'[Number(s)-1]:s;}
function parseQuestionLines(lines,answerText=''){
  const answers=parseAnswerKey(answerText);
  const cleaned=lines.map(cleanPdfLine).filter(Boolean).filter(s=>!isPdfNoise(s));
  const starts=[];
  cleaned.forEach((line,idx)=>{
    const m=line.match(/^\s*(?:Q(?:uestion)?\s*)?(\d{1,4})\s*[.)]\s*(.*)$/i);
    if(m)starts.push({idx,number:Number(m[1]),rest:m[2]});
  });
  const out=[];
  for(let si=0;si<starts.length;si++){
    const st=starts[si],end=starts[si+1]?.idx??cleaned.length;
    let raw=st.rest;
    for(const l of cleaned.slice(st.idx+1,end)) raw+=(raw?' ':'')+l;
    raw=raw.replace(/\s+/g,' ').trim();

    const optRe=/(?:^|\s)(?:\(([ABCD])\)|([ABCD])[.)]|(?:\(([1-4])\)|([1-4])[.)]))(?=\s)/gi;
    const matches=[...raw.matchAll(optRe)];

    // Keep only a coherent A→B→C→D or 1→2→3→4 sequence.
    const normalized=matches.map((m,i)=>({
      raw:m[0],
      label:normalizeOptionLabel(m[1]||m[2]||m[3]||m[4]),
      index:m.index,
      end:m.index+m[0].length
    }));
    let seq=[];
    for(let i=0;i<normalized.length;i++){
      const cand=normalized.slice(i,i+4);
      if(cand.length===4 && cand.map(x=>x.label).join('')==='ABCD'){seq=cand;break;}
    }
    if(seq.length!==4)continue;

    const first=seq[0].index;
    const question=raw.slice(0,first).trim();
    if(!question)continue;

    const opts=seq.map((item,j)=>{
      const start=item.end;
      const next=seq[j+1]?.index??raw.length;
      return raw.slice(start,next).trim().replace(/\s+/g,' ');
    });
    if(opts.some(o=>!o))continue;

    out.push({
      number:st.number,
      question:question.replace(/\s+/g,' ').trim(),
      options:opts,
      correct_option:answers[st.number]||null
    });
  }
  return out;
}

function parseQuestions(text,answerText=''){return parseQuestionLines(String(text||'').split(/\n+/),answerText);}

}

function studentDashboard(){const p=state.student.progress,correct=p.reduce((a,x)=>a+(x.correct_count||0),0),wrong=p.reduce((a,x)=>a+(x.wrong_count||0),0),total=p.reduce((a,x)=>a+(x.total_questions||0),0),acc=total?(correct/total*100):0;return `<section class="stats"><div class="card stat"><div class="muted">Tests Taken</div><strong>${p.length}</strong></div><div class="card stat"><div class="muted">Correct</div><strong>${correct}</strong></div><div class="card stat"><div class="muted">Wrong</div><strong>${wrong}</strong></div><div class="card stat"><div class="muted">Accuracy</div><strong>${acc.toFixed(1)}%</strong></div></section><section class="card"><h2>My Progress</h2><p class="muted">Your own saved test history and accuracy.</p><div class="progressbar"><span style="width:${Math.min(100,acc)}%"></span></div></section>`;}
function studentTests(){return `<section class="card"><h2>Assigned Tests</h2>${state.student.tests.map(t=>`<div class="card"><div class="section-title"><div><h3>${esc(t.title)}</h3><p class="muted">${t.question_count} questions · ${t.duration_minutes} minutes</p></div>${t.completed?`<button type="button" class="btn primary" data-open-report="${t.last_attempt_id||''}">View Report</button>`:`<button type="button" class="btn primary" data-start="${t.id}">Start Test</button>`}</div>${t.completed?`<p class="small muted">Completed on ${fmt(t.submitted_at)}</p>`:''}</div>`).join('')||empty('No tests assigned yet.')}</section>`;}
function studentProgress(){return `<section class="card"><h2>Past Tests & Progress</h2><p class="muted">Every completed test is listed separately.</p><div class="table-wrap"><table><thead><tr><th>Test</th><th>Score</th><th>Total Marks</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Accuracy</th><th>Time</th><th>Date</th><th>Report</th></tr></thead><tbody>${state.student.progress.map(x=>`<tr><td>${esc(x.test_title||'')}</td><td>${money(x.score)}</td><td>${money(x.total_marks)}</td><td>${x.correct_count}</td><td>${x.wrong_count}</td><td>${x.skipped_count}</td><td>${money(x.accuracy)}%</td><td>${fmtSeconds(x.time_spent_seconds)}</td><td>${fmt(x.submitted_at)}</td><td><button class="btn secondary sm" data-student-report="${x.attempt_id}">View Report</button></td></tr>`).join('')||`<tr><td colspan="10">${empty('No completed tests yet.')}</td></tr>`}</tbody></table></div></section>`;}
async function openStudentReport(attemptId){if(!attemptId){alert('This completed test has no report reference. Run the included SQL migration once, then refresh.');return;}state.result=null;state.student.selectedAttemptId=attemptId;state.tab='report';await renderStudent();}
async function renderStudentReport(){const id=state.student.selectedAttemptId;if(!id)return `<section class="card"><div class="notice">Choose a completed test to view its report.</div></section>`;const {data,error}=await sb.rpc('get_student_attempt_report',{p_attempt_id:id});if(error)return `<section class="card"><div class="notice">Unable to load this report: ${esc(error.message)}</div></section>`;const rows=data||[];return `<section class="card"><div class="section-title"><div><h2>Test Report</h2><p class="muted">Question-wise review with all options, your response, correct answer and time spent.</p></div><button class="btn secondary" id="backProgress">Back to Progress</button></div>${rows.map(x=>{const opts=[['A',x.option_a],['B',x.option_b],['C',x.option_c],['D',x.option_d]];return `<article class="report-question"><div class="report-question-head"><div><span class="report-qnum">Q${esc(x.question_order||'—')}</span>${x.question_number?` <span class="muted small">(Source ${esc(x.question_number)})</span>`:''}</div><div class="report-status">${x.status==='correct'?'✅ Correct':x.status==='wrong'?'❌ Wrong':'⏭️ Skipped'}</div></div><div class="top16"><b>${esc(x.question)}</b></div><div class="report-options">${opts.map(([l,v])=>v!=null&&String(v).trim()!==''?`<div class="report-option ${x.selected_option===l?'selected':''} ${x.status!=='skipped'&&x.correct_option===l?'correct':''}">${l}. ${esc(v)}${x.selected_option===l?`<span class="tag">Your answer</span>`:''}${x.status!=='skipped'&&x.correct_option===l?`<span class="tag">Correct answer</span>`:''}</div>`:'').join('')}</div><div class="report-meta"><div class="report-meta-box"><span class="muted small">Your Response</span><br><b>${esc(x.selected_option||'—')}</b></div><div class="report-meta-box"><span class="muted small">Correct Answer</span><br><b>${esc(x.correct_option||'—')}</b></div><div class="report-meta-box"><span class="muted small">Time Spent</span><br><b>${fmtSeconds(x.time_spent_seconds)}</b></div><div class="report-meta-box"><span class="muted small">Marked for Review</span><br><b>${x.marked_for_review?'Yes':'No'}</b></div></div></article>`}).join('')||empty('No question-level report available.')}</section>`;}
function renderResult(){const r=state.result?.data||{};return `<section class="card"><div class="section-title"><div><h2>Test Result</h2><p class="muted">${esc(state.result?.testTitle||'Completed Test')}</p></div><span class="badge good">Submitted</span></div><div class="result-grid top20"><div class="card stat"><div class="muted">Score</div><div class="result-value">${money(r.score)}</div></div><div class="card stat"><div class="muted">Correct</div><div class="result-value">${r.correct||0}</div></div><div class="card stat"><div class="muted">Wrong</div><div class="result-value">${r.wrong||0}</div></div><div class="card stat"><div class="muted">Skipped</div><div class="result-value">${r.skipped||0}</div></div></div><div class="card"><div class="grid2"><p><b>Accuracy:</b> ${money(r.accuracy)}%</p><p><b>Total questions:</b> ${r.total||0}</p><p><b>Total marks:</b> ${money(r.total_marks)}</p><p><b>Time spent:</b> ${fmtSeconds(r.time_spent_seconds)}</p></div><div class="detail-actions"><button class="btn primary" id="resultProgress">My Progress</button><button class="btn secondary" id="resultReport">View Question Report</button></div></div></section>`;}

async function startTest(testId){
  const t=state.student.tests.find(x=>String(x.id)===String(testId));
  if(!t){alert('Test details could not be loaded. Please refresh the page and try again.');return;}
  if(t.completed){alert('This test has already been completed.');return;}
  const btnEl=document.querySelector(`[data-start="${CSS.escape(String(testId))}"]`);
  if(btnEl){btnEl.disabled=true;btnEl.textContent='Starting…';}
  try{
    const {data:launch,error:launchError}=await sb.rpc('start_student_attempt',{p_test_id:testId});
    if(launchError) throw new Error(launchError.message);
    const attempt=Array.isArray(launch)?launch[0]:launch;
    if(!attempt||!attempt.id) throw new Error('The test could not be started. No attempt was created.');
    const {data:rawQs,error}=await sb.rpc('get_student_test_questions',{p_test_id:testId});
    if(error) throw new Error(error.message);
    if(!Array.isArray(rawQs)||!rawQs.length) throw new Error('This test has no available questions. Please check the test question selection.');
    // Supabase returns option_a/option_b/option_c/option_d fields.
    // The exam renderer expects a normalized `question` + `options[]` shape.
    const qs=rawQs.map((x,i)=>({
      id:x.id,
      question_order:x.question_order ?? (i+1),
      question:x.question ?? x.question_text ?? '',
      options:[x.option_a,x.option_b,x.option_c,x.option_d].filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='').map(String),
      question_image_paths:Array.isArray(x.question_image_paths)?x.question_image_paths:[]
    }));
    if(qs.some(x=>!x.question || x.options.length<4)) throw new Error('One or more questions could not be loaded in a usable text format. Please check the Question Bank entry.');
    const answers={},marked={},visited={},timeSpent={};
    const saved=await sb.from('attempt_answers').select('question_id,selected_option,marked_for_review,visited_at,time_spent_seconds').eq('attempt_id',attempt.id);
    if(!saved.error){for(const x of saved.data||[]){answers[x.question_id]=x.selected_option;marked[x.question_id]=!!x.marked_for_review;visited[x.question_id]=!!x.visited_at||x.selected_option!==null;timeSpent[x.question_id]=Number(x.time_spent_seconds||0);}}
    state.attempt={id:attempt.id,testId,title:t.title,duration:t.duration_minutes,questions:qs,index:0,answers,marked,visited,timeSpent,startedAt:attempt.started_at||new Date().toISOString(),questionTiming:{questionId:null,startedAt:0},flushTimer:null};
    state.tab='exam';
    renderExam();
  }catch(e){
    alert(`Unable to start test.\n\n${e.message||e}`);
    if(btnEl){btnEl.disabled=false;btnEl.textContent='Start Test';}
  }
}
function palette(a){return `<div class="palette">${a.questions.map((q,i)=>`<button class="qnum ${a.visited[q.id]&&!a.answers[q.id]?'visited':''} ${a.answers[q.id]?'answered':''} ${a.marked[q.id]?'review':''} ${i===a.index?'current':''}" data-i="${i}">${i+1}</button>`).join('')}</div>`;}
async function flushQuestionTime(){const a=state.attempt;if(!a)return;const q=a.questions[a.index];if(!q)return;if(a.questionTiming.questionId!==q.id)a.questionTiming={questionId:q.id,startedAt:Date.now()};const delta=Math.max(0,Math.floor((Date.now()-a.questionTiming.startedAt)/1000));if(delta<=0)return;const total=(a.timeSpent[q.id]||0)+delta;const {error}=await sb.rpc('record_question_activity',{p_attempt_id:a.id,p_question_id:q.id,p_selected_option:a.answers[q.id]||null,p_marked_for_review:!!a.marked[q.id],p_time_spent_seconds:total});if(!error){a.timeSpent[q.id]=total;a.questionTiming.startedAt=Date.now();}}
async function markQuestionVisited(){const a=state.attempt;if(!a)return;const q=a.questions[a.index];a.visited[q.id]=true;await sb.rpc('record_question_activity',{p_attempt_id:a.id,p_question_id:q.id,p_selected_option:a.answers[q.id]||null,p_marked_for_review:!!a.marked[q.id],p_time_spent_seconds:Number(a.timeSpent[q.id]||0)});}
function renderExam(){clearInterval(timer);const a=state.attempt;if(!a)return renderStudent();const q=a.questions[a.index];if(a.questionTiming.questionId!==q.id)a.questionTiming={questionId:q.id,startedAt:Date.now()};const body=`<div class="exam-head"><div><b>${esc(a.title)}</b><div class="muted">Question ${a.index+1} of ${a.questions.length}</div></div><div id="timer" class="timer">--:--</div></div><div class="exam-grid"><section class="card"><div class="question-text">${esc(q.question)}</div><div class="options">${q.options.map((o,i)=>{const l=String.fromCharCode(65+i);return `<label class="option ${a.answers[q.id]===l?'selected':''}"><input type="radio" name="answer" value="${l}" ${a.answers[q.id]===l?'checked':''}><span><b>${l}.</b> ${esc(o)}</span></label>`;}).join('')}</div><div class="row gap top20"><button class="btn secondary" id="prev" ${a.index===0?'disabled':''}>Previous</button><button class="btn secondary" id="clear">Clear Response</button><button class="btn warn" id="mark">${a.marked[q.id]?'Unmark Review':'Mark for Review'}</button><button class="btn primary" id="next">${a.index===a.questions.length-1?'Submit Test':'Save & Next'}</button></div></section><aside class="card"><h3>Question Palette</h3>${palette(a)}<div class="legend"><span class="badge good">Answered</span><span class="badge warn">Review</span><span class="badge">Visited / Not Answered</span></div></aside></div>`;app.innerHTML=`<header class="topbar"><div class="brand">RUDRAKSH CBT EXAMINATION</div><div>${btn('Submit Test','examSubmit','danger')}</div></header><main class="container">${body}</main>`;
document.querySelectorAll('[name="answer"]').forEach(r=>r.onchange=async()=>{await flushQuestionTime();a.answers[q.id]=r.value;a.visited[q.id]=true;await sb.rpc('record_question_activity',{p_attempt_id:a.id,p_question_id:q.id,p_selected_option:r.value,p_marked_for_review:!!a.marked[q.id],p_time_spent_seconds:Number(a.timeSpent[q.id]||0)});renderExam();});
document.getElementById('prev').onclick=async()=>{await flushQuestionTime();a.index--;a.questionTiming={questionId:null,startedAt:0};renderExam();};
document.getElementById('clear').onclick=async()=>{await flushQuestionTime();delete a.answers[q.id];a.visited[q.id]=true;await sb.rpc('record_question_activity',{p_attempt_id:a.id,p_question_id:q.id,p_selected_option:null,p_marked_for_review:!!a.marked[q.id],p_time_spent_seconds:Number(a.timeSpent[q.id]||0)});renderExam();};
document.getElementById('mark').onclick=async()=>{await flushQuestionTime();a.marked[q.id]=!a.marked[q.id];a.visited[q.id]=true;await sb.rpc('record_question_activity',{p_attempt_id:a.id,p_question_id:q.id,p_selected_option:a.answers[q.id]||null,p_marked_for_review:a.marked[q.id],p_time_spent_seconds:Number(a.timeSpent[q.id]||0)});renderExam();};
document.getElementById('next').onclick=async()=>{if(a.index===a.questions.length-1){await submitExam(false);}else{await flushQuestionTime();a.visited[q.id]=true;await markQuestionVisited();a.index++;a.questionTiming={questionId:null,startedAt:0};renderExam();}};
document.getElementById('examSubmit').onclick=()=>submitExam(false);
document.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{await flushQuestionTime();a.visited[q.id]=true;await markQuestionVisited();a.index=Number(b.dataset.i);a.questionTiming={questionId:null,startedAt:0};renderExam();});
timer=setInterval(()=>updateTimer(a),1000);updateTimer(a);clearInterval(a.flushTimer);a.flushTimer=setInterval(()=>{if(state.attempt)flushQuestionTime();},5000);markQuestionVisited();}
function updateTimer(a){const total=a.duration*60000,left=Math.max(0,total-(Date.now()-new Date(a.startedAt).getTime())),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;const el=document.getElementById('timer');if(el)el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(left<=0){clearInterval(timer);submitExam(true);}}async function submitExam(auto){if(!state.attempt||state.attempt.submitting)return;state.attempt.submitting=true;const {data,error}=await sb.rpc('submit_attempt',{p_attempt_id:state.attempt.id});if(error){alert(error.message);return;}clearInterval(timer);const r=data?.[0]||data;state.attempt=null;state.tab='progress';alert(auto?'Time expired. Test auto-submitted.':`Test submitted. Score: ${r?.score??'saved'}`);renderStudent();}
boot();

</script>
