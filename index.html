<style>

-text)}textarea{min-height:100px;resize:vertical}.row{display:flex;align-items:center;flex-wrap:wrap}.gap{gap:8px}.top12{margin-top:12px}.top16{margin-top:16px}.top20{margin-top:20px}.muted{color:var(--muted)}.small{font-size:13px}.notice,.success,.error{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#f7f9fc}.success{background:#effaf4;border-color:#a9ddbd;color:#155e38}.error{background:#fff0f0;border-color:#efb1b1;color:#8d1d1d}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:14px 0}.toolbar input{flex:1;padding:10px 12px;border:1px solid #cbd8ea;border-radius:10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{background:#f6f8fc}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.good{background:#e5f7ed;color:var(--good)}.warn{background:#fff1dc;color:var(--warn)}.dangerText{color:var(--danger)}.login-card{max-width:420px;margin:28px auto}.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px}.section-title h2{margin:0}.section-title p{margin:4px 0 0}.pick-list{display:grid;gap:8px;max-height:520px;overflow:auto;border:1px solid var(--line);padding:10px;border-radius:12px}.pick{display:flex;gap:10px;align-items:flex-start;border:1px solid #e5ebf3;border-radius:10px;padding:10px;background:#fbfcfe}.pick input{margin-top:4px}.preview-grid{display:grid;gap:14px}.preview-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.preview-card img{display:block;width:100%;max-height:520px;object-fit:contain;background:#f6f8fb;border-radius:10px;margin:10px 0}.preview-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.answer-pill{font-weight:800}.question-copy{white-space:pre-wrap;line-height:1.45}.choice-list{display:grid;gap:8px;margin-top:14px}.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.choice.selected{border-color:var(--blue);background:var(--soft)}.question-image{display:block;width:100%;max-height:640px;object-fit:contain;background:#f7f9fc;border-radius:12px;border:1px solid var(--line)}.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}.exam-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:58px;z-index:10}.timer{font-size:24px;font-weight:800;color:var(--navy)}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qnum{border:1px solid #cbd8ea;border-radius:8px;padding:9px;background:#fff}.qnum.current{outline:2px solid var(--blue)}.qnum.answered{background:#e5f7ed;border-color:#a9ddbd}.qnum.review{box-shadow:inset 0 -3px 0 #e4a13b}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modal-backdrop{position:fixed;inset:0;background:rgba(7,24,49,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal{max-width:1000px;width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--line);padding:18px}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi .item{border:1px solid var(--line);padding:12px;border-radius:10px;background:#fbfcfe}.progressbar{height:12px;background:#e7eef7;border-radius:999px;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--blue)}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid2,.grid3,.exam-grid{grid-template-columns:1fr}.container{padding:14px}.exam-head{top:58px}.palette{grid-template-columns:repeat(6,1fr)}}

<body>
<div id="app"></div>
<script type="module">
const { createClient } = window.supabase;
const cfg = window.RUDRAKSH_CONFIG || {};
const app = document.getElementById('app');
const ready = typeof cfg.SUPABASE_URL === 'string' && cfg.SUPABASE_URL.startsWith('https://') && typeof cfg.SUPABASE_ANON_KEY === 'string' && cfg.SUPABASE_ANON_KEY.startsWith('sb_');
const sb = ready ? createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
let user=null, profile=null, timer=null;
const state={tab:'dashboard', teacher:{questions:[],tests:[],students:[],reports:[],answers:new Map()}, student:{tests:[],progress:[]}, attempt:null};

const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v).toLocaleString():'—';
const num=v=>Number(v||0).toFixed(2).replace(/\.00$/,'');
const shell=(title,subtitle,body,actions='')=>`<header class="topbar"><div class="brand">RUDRAKSH CBT EXAMINATION</div><div>${actions}</div></header><main class="container"><section class="hero"><h1>${esc(title)}</h1><p>${esc(subtitle||'Professional online CBT management system')}</p></section>${body}</main>`;
const btn=(t,id='',k='primary',attrs='')=>`<button class="btn ${k}" id="${id}" ${attrs}>${t}</button>`;
const empty=t=>`<div class="empty">${esc(t)}</div>`;

async function boot(){
  if(!ready){ setupScreen(); return; }
  const {data:{session}}=await sb.auth.getSession();
  user=session?.user||null;
  if(!user){ loginScreen(); return; }
  await loadProfile();
}
function setupScreen(){app.innerHTML=shell('Online setup required','Professional online CBT management system',`<section class="card"><div class="error"><b>Supabase configuration is missing.</b><br>Open <code>config.js</code> and add your Project URL and Publishable key. Never use a secret/service-role key here.</div></section>`);}
function loginScreen(message=''){app.innerHTML=shell('Secure Login','Teacher and Student access',`<section class="card login-card"><h2>Sign in</h2><p class="muted">Use your registered email and password.</p>${message?`<div class="error">${esc(message)}</div>`:''}<label>Email address<input id="email" type="email" autocomplete="username" placeholder="Teacher / Student email"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Password"></label><div class="row gap top16">${btn('Sign in','loginBtn')}</div><p id="loginMsg" class="muted small"></p></section>`);document.getElementById('loginBtn').onclick=login;}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('loginMsg');if(!email||!password){msg.textContent='Enter email and password.';return;}msg.textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;return;}user=data.user;await loadProfile();}
async function loadProfile(){const {data:p,error}=await sb.from('profiles').select('id,role,full_name,user_code').eq('id',user.id).single();if(error||!p){loginScreen('Your account exists, but its profile is not ready.');return;}profile=p;state.tab='dashboard';await renderApp();}
async function logout(){clearInterval(timer);await sb.auth.signOut();user=null;profile=null;state.attempt=null;loginScreen();}
function nav(items){return `<nav class="tabs">${items.map(([k,l])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</nav>`;}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{state.tab=b.dataset.tab;await renderApp();});const l=document.getElementById('logout');if(l)l.onclick=logout;const cp=document.getElementById('savePw');if(cp)cp.onclick=changePassword;}
async function renderApp(){if(profile.role==='teacher')return renderTeacher();return renderStudent();}

async function renderTeacher(){
 const [q,t,s,r,ans]=await Promise.all([
  sb.from('questions').select('id,source_question_number,question_text,option_a,option_b,option_c,option_d,question_image_paths,display_mode,created_at').eq('is_active',true).order('created_at',{ascending:false}),
  sb.from('tests').select('id,title,description,duration_minutes,default_marks,default_negative_marks,is_published,created_at').order('created_at',{ascending:false}),
  sb.from('profiles').select('id,user_code,full_name,role').eq('role','student').order('full_name'),
  sb.from('teacher_attempt_report').select('*').order('submitted_at',{ascending:false}),
  sb.from('question_answers').select('question_id,correct_option')
 ]);
 state.teacher.questions=q.data||[];state.teacher.tests=t.data||[];state.teacher.students=s.data||[];state.teacher.reports=r.data||[];state.teacher.answers=new Map((ans.data||[]).map(x=>[x.question_id,x.correct_option]));
 let body=nav([['dashboard','Dashboard'],['questions','Question Bank'],['import','Import Questions'],['tests','Create Test'],['students','Students'],['reports','Performance'],['account','My Account']]);
 if(state.tab==='dashboard') body+=teacherDashboard();
 if(state.tab==='questions') body+=teacherQuestions();
 if(state.tab==='import') body+=teacherImport();
 if(state.tab==='tests') body+=teacherTests();
 if(state.tab==='students') body+=teacherStudents();
 if(state.tab==='reports') body+=teacherReports();
 if(state.tab==='account') body+=accountPanel();
 app.innerHTML=shell('Teacher Dashboard',`Welcome, ${profile.full_name||'Teacher'} · ${profile.user_code||'T001'}`,body,btn('Logout','logout','secondary'));bindTabs();bindTeacher();
}
function teacherDashboard(){return `<section class="stats"><div class="card stat"><div class="muted">Questions</div><strong>${state.teacher.questions.length}</strong></div><div class="card stat"><div class="muted">Tests</div><strong>${state.teacher.tests.length}</strong></div><div class="card stat"><div class="muted">Students</div><strong>${state.teacher.students.length}</strong></div><div class="card stat"><div class="muted">Submitted Attempts</div><strong>${state.teacher.reports.length}</strong></div></section><section class="card"><h2>Teacher Control Center</h2><div class="grid2"><div><b>1.</b> Import questions from PDF + optional answer key</div><div><b>2.</b> Verify answers before publishing</div><div><b>3.</b> Build 1–300+ question tests</div><div><b>4.</b> Assign tests to students</div><div><b>5.</b> Review question-wise performance</div><div><b>6.</b> Keep complete attempt history</div></div><div class="notice top16">The production bank contains only questions that the teacher imports or adds. No demo questions are included.</div></section>`;}
function teacherQuestions(){return `<section class="card"><div class="section-title"><div><h2>Question Bank</h2><p class="muted">Only question content is displayed here. Source headers/sections are never imported into the question text.</p></div><button class="btn primary" data-tab="import">Import Questions</button></div><div class="toolbar"><input id="qSearch" placeholder="Search question text or number"><span class="small muted">${state.teacher.questions.length} stored</span></div><div id="qTable" class="table-wrap"></div></section>`;}
function renderQuestionTable(filter=''){const f=filter.toLowerCase().trim();const rows=state.teacher.questions.filter(q=>(`${q.source_question_number||''} ${q.question_text||''}`).toLowerCase().includes(f));return `<table><thead><tr><th>No.</th><th>Question</th><th>Status</th><th>Manage</th></tr></thead><tbody>${rows.map(q=>{const a=state.teacher.answers.get(q.id);return `<tr><td>${esc(q.source_question_number||'—')}</td><td>${esc(q.question_text||'')}</td><td>${a?`<span class="badge good">Verified: ${esc(a)}</span>`:`<span class="badge warn">Answer pending</span>`}</td><td><div class="row gap">${a?'':`<button class="btn secondary sm" data-set-answer="${q.id}">Set Answer</button>`}<button class="btn danger sm" data-delete-question="${q.id}">Delete</button></div></td></tr>`}).join('')||`<tr><td colspan="4">${empty('No questions found.')}</td></tr>`}</tbody></table>`;}
async function setAnswer(id){const q=state.teacher.questions.find(x=>x.id===id);if(!q)return;const v=prompt(`Correct answer for question ${q.source_question_number||''}: enter A, B, C or D`);if(!v)return;const c=normalizeOption(v.trim());if(!/^[ABCD]$/.test(c)){alert('Enter A, B, C or D.');return;}const {error}=await sb.from('question_answers').upsert({question_id:id,correct_option:c,explanation:null},{onConflict:'question_id'});if(error){alert(error.message);return;}await renderTeacher();}
async function deleteQuestion(id){const q=state.teacher.questions.find(x=>x.id===id);if(!q)return;if(!confirm(`Delete question ${q.source_question_number||''}?\n\nThis cannot be undone.`))return;const paths=q.question_image_paths||[];const {error}=await sb.from('questions').delete().eq('id',id);if(error){alert(error.message);return;}if(paths.length)await sb.storage.from('question-assets').remove(paths);await renderTeacher();}
function teacherImport(){return `<section class="card"><h2>Import Questions</h2><p class="muted">Upload a question PDF and an optional answer-key PDF. The importer uses the answer-key question numbers to decide which questions belong to this import. Headers, page labels, section names and institute metadata are not stored as question content.</p><div class="grid2"><label>Question PDF<input id="qFile" type="file" accept="application/pdf"></label><label>Answer key PDF (optional)<input id="aFile" type="file" accept="application/pdf"></label></div><div class="row gap top12"><button class="btn primary" id="analyzePdf">Analyze PDF</button><button class="btn secondary" id="clearImport">Clear</button></div><div id="importProgress" class="small muted top12"></div><div id="importPreview" class="top16"></div></section>`;}
async function bindTeacher(){
 const qt=document.getElementById('qTable');if(qt)qt.innerHTML=renderQuestionTable();
 document.getElementById('qSearch')?.addEventListener('input',e=>{const b=document.getElementById('qTable');if(b)b.innerHTML=renderQuestionTable(e.target.value);document.querySelectorAll('[data-delete-question]').forEach(x=>x.onclick=()=>deleteQuestion(x.dataset.deleteQuestion));});
 document.querySelectorAll('[data-delete-question]').forEach(x=>x.onclick=()=>deleteQuestion(x.dataset.deleteQuestion));
 document.querySelectorAll('[data-set-answer]').forEach(x=>x.onclick=()=>setAnswer(x.dataset.setAnswer));
 document.getElementById('analyzePdf')?.addEventListener('click',analyzePdfImport);
 document.getElementById('clearImport')?.addEventListener('click',()=>renderTeacher());
 document.getElementById('createTest')?.addEventListener('click',createTest);
 document.getElementById('testSearch')?.addEventListener('input',renderPickList);
 document.getElementById('selectAllQs')?.addEventListener('click',()=>document.querySelectorAll('.tq').forEach(x=>x.checked=true));
 document.getElementById('clearAllQs')?.addEventListener('click',()=>document.querySelectorAll('.tq').forEach(x=>x.checked=false));
 document.querySelectorAll('[data-attempt]').forEach(b=>b.onclick=()=>showTeacherAttempt(b.dataset.attempt));
}

async function loadPdfJs(){const mod=await window.pdfjsReady;mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';return mod;}
async function pdfToPages(file){const pdfjs=await loadPdfJs();const buf=await file.arrayBuffer();const pdf=await pdfjs.getDocument({data:buf}).promise;const pages=[];for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){const page=await pdf.getPage(pageNo);const content=await page.getTextContent({normalizeWhitespace:false,disableCombineTextItems:false});const vp=page.getViewport({scale:1});const lines=groupPdfLines(content.items);pages.push({pageNo,page,vp,lines});}return pages;}
function groupPdfLines(items){
 const rows=[];
 for(const it of items){const s=(it.str||'').trim();if(!s)continue;const x=it.transform?.[4]||0,y=it.transform?.[5]||0,h=Math.max(8,Math.abs(it.transform?.[3]||10));let row=rows.find(r=>Math.abs(r.y-y)<=4);if(!row){row={y,items:[],h};rows.push(row);}row.items.push({s,x,h});row.h=Math.max(row.h,h);}
 return rows.sort((a,b)=>b.y-a.y).map(r=>({y:r.y,h:r.h,x:r.items.reduce((m,i)=>Math.min(m,i.x),Infinity),text:r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()}));
}
function metadataLine(s){return /^(?:NPT[-_].*|THE RADIANT.*|SECTION\s*[–-]|CORPORATE OFFICE|Mob\.?No\.?|Website\s*:|E-mail\s*:|INSTRUCTIONS FOR CANDIDATES|Atomic masses\s*:|Time:\s*|Maximum Marks\s*:|Straight Objective Type|This section contains\b|COURSE\s*:|TARGET\s*:)/i.test(s)||/^\d+\s*\/\s*\d+$/.test(s);}
function findQuestionLines(pages,targetNumbers){
 const targets=targetNumbers?.length?new Set(targetNumbers.map(Number)):null;const starts=[];
 for(const p of pages){for(let i=0;i<p.lines.length;i++){const m=p.lines[i].text.match(/^(\d{1,4})\s*[\.)]\s*(.*)$/);if(!m)continue;const n=Number(m[1]);if(targets && !targets.has(n))continue;starts.push({number:n,pageIndex:p.pageNo-1,lineIndex:i,y:p.lines[i].y});}}
 starts.sort((a,b)=>a.pageIndex-b.pageIndex||b.y-a.y);const unique=[];const seen=new Set();for(const s of starts){if(seen.has(`${s.number}|${s.pageIndex}|${Math.round(s.y)}`))continue;seen.add(`${s.number}|${s.pageIndex}|${Math.round(s.y)}`);unique.push(s);}return unique;
}
function parseAnswerKeyText(text){
 const cleaned=String(text||'').replace(/\u00a0/g,' ');const map={};
 const lines=cleaned.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 for(let i=0;i<lines.length;i++){
  const q=lines[i].match(/^QUES\s+(.+)$/i);if(q){const nums=q[1].match(/\d+/g)?.map(Number)||[];const next=lines[i+1]?.match(/^ANS\s+(.+)$/i);if(next){const ans=next[1].match(/[ABCD]/gi)||[];nums.forEach((n,j)=>{if(ans[j])map[n]=ans[j].toUpperCase();});}}
  const one=lines[i].match(/^(?:Q(?:UES)?\.?\s*)?(\d{1,4})\s*[:.)-]\s*(?:ANS\.?\s*)?([ABCD1-4])$/i);if(one){map[Number(one[1])]=normalizeOption(one[2]);}
 }
 if(Object.keys(map).length===0){for(const m of cleaned.matchAll(/(?:QUES|QUE|QUESTION)\s*([0-9][0-9\s,.-]*)/gi)){const nums=(m[1].match(/\d+/g)||[]).map(Number);const rest=cleaned.slice(m.index+m[0].length);const am=rest.match(/ANS\s*([ABCD\s,.-]+)/i);if(am){const ans=am[1].match(/[ABCD]/gi)||[];nums.forEach((n,j)=>{if(ans[j])map[n]=ans[j].toUpperCase();});}}}
 return map;
}
function normalizeOption(v){const s=String(v).toUpperCase();return /^[1-4]$/.test(s)?String.fromCharCode(64+Number(s)):s;}
function extractMainOptions(lines){
 const candidates=[];
 for(let i=0;i<lines.length;i++){
  const m=lines[i].text.match(/^\(?([ABCD])\)?(?:\.|\)|:|-)?\s+(.*)$/i);if(m)candidates.push({i,key:m[1].toUpperCase(),text:m[2].trim(),y:lines[i].y});
 }
 for(let start=0;start<=candidates.length-4;start++){
  const seq=candidates.slice(start,start+4);const keys=seq.map(x=>x.key);if(keys.join('')==='ABCD')return {markers:seq};
 }
 return {markers:[]};
}
function cleanQuestionText(s){return String(s||'').replace(/\s+/g,' ').replace(/(?:NPT[-_][A-Z0-9_-]+)\s*/gi,'').replace(/\b(?:The Radiant Academy|SECTION\s*[–-]?\s*[A-Z])\b/gi,'').trim();}
async function extractQuestionRecords(qFile,aFile){
 const aPages=aFile?await pdfToPages(aFile):[];const answerText=aPages.flatMap(p=>p.lines.map(l=>l.text)).join('\n');const answers=parseAnswerKeyText(answerText);
 const qPages=await pdfToPages(qFile);const targets=Object.keys(answers).map(Number).sort((a,b)=>a-b);const starts=findQuestionLines(qPages,targets);
 // If no answer key, detect all sequential starts.
 if(!starts.length){const all=findQuestionLines(qPages,null);for(const x of all)starts.push(x);}
 const records=[];
 for(let idx=0;idx<starts.length;idx++){
  const st=starts[idx];const en=starts[idx+1];const pageChunks=[];let collected=[];let optionFirstY=null;let optionTexts=null;
  for(let pi=st.pageIndex;pi<=(en?.pageIndex??st.pageIndex);pi++){
   const p=qPages[pi];const from=pi===st.pageIndex?st.lineIndex:0;const to=en&&pi===en.pageIndex?en.lineIndex:p.lines.length;const lines=p.lines.slice(from,to).filter(l=>!metadataLine(l.text));collected.push(...lines);const opts=extractMainOptions(lines);if(!optionFirstY&&opts.markers.length===4){optionFirstY=opts.markers[0].y;optionTexts=opts.markers.map(x=>x.text);}
   const contentMinY=lines.length?Math.min(...lines.map(l=>l.y)):40;
   const finalToY=en&&pi===en.pageIndex?(en.y+12):Math.max(38,contentMinY-8);
   pageChunks.push({page:p,fromY:pi===st.pageIndex?st.y+8:Math.max(35,p.vp.height-55),toY:finalToY,optionFirstY:pi===st.pageIndex&&optionFirstY?optionFirstY:null});
  }
  const raw=collected.map(x=>x.text).join(' ');let mainOpts=extractMainOptions(collected);if(!mainOpts.markers.length&&optionTexts)mainOpts={markers:optionTexts.map((text,i)=>({key:String.fromCharCode(65+i),text}))};
  let questionText=raw;if(mainOpts.markers.length===4){const firstText=mainOpts.markers[0].text;const pos=raw.indexOf(firstText);if(pos>=0)questionText=raw.slice(0,pos);}questionText=cleanQuestionText(questionText);
  const options=mainOpts.markers.length===4?mainOpts.markers.map(x=>cleanQuestionText(x.text)):['','','',''];
  const visual=pageChunks.length>0 && (collected.some(l=>/figure|diagram|shown|following/i.test(l.text))||options.some(x=>!x));
  records.push({number:st.number,question:questionText,options,correct_option:answers[st.number]||null,visual,pageChunks});
 }
 // Remove obvious duplicates and require real question content.
 const ded=[];const seen=new Set();for(const r of records){if(seen.has(r.number))continue;seen.add(r.number);if(r.question||r.visual)ded.push(r);}return {records:ded,answers};
}
async function renderCrop(page,fromPdfY,toPdfY){
 const scale=1.8;const vp=page.getViewport({scale});const full=document.createElement('canvas');full.width=Math.ceil(vp.width);full.height=Math.ceil(vp.height);await page.render({canvasContext:full.getContext('2d'),viewport:vp}).promise;
 const margin=12;let top=vp.height-(Number(fromPdfY||0)*scale)-margin;let bottom=toPdfY!=null?vp.height-(Number(toPdfY)*scale)+margin:vp.height-28;top=Math.max(0,Math.min(vp.height-40,top));bottom=Math.max(top+40,Math.min(vp.height,bottom));
 const crop=document.createElement('canvas');crop.width=full.width;crop.height=Math.ceil(bottom-top);crop.getContext('2d').drawImage(full,0,top,full.width,crop.height,0,0,full.width,crop.height);return crop;
}
async function dataUrlToBlob(dataUrl){const r=await fetch(dataUrl);return await r.blob();}
async function analyzePdfImport(){
 const qf=document.getElementById('qFile')?.files[0],af=document.getElementById('aFile')?.files[0],box=document.getElementById('importPreview'),prog=document.getElementById('importProgress');if(!qf){box.innerHTML='<div class="error">Choose a question PDF first.</div>';return;}
 box.innerHTML='';prog.textContent='Reading PDF…';try{const {records,answers}=await extractQuestionRecords(qf,af);if(!records.length){box.innerHTML='<div class="error">No questions could be safely detected. No data was changed.</div>';prog.textContent='';return;}
 const matched=records.filter(r=>r.correct_option).length;window.__pdfImport={records,qf,af};const sample=records.slice(0,8);prog.textContent=`Detected ${records.length} question(s). Preparing a visual preview of the first ${sample.length}…`;
 const cards=[];for(let i=0;i<sample.length;i++){const r=sample[i];const imgs=await renderQuestionImage(r);cards.push(`<article class="preview-card"><div class="preview-meta"><b>Question ${esc(r.number)}</b><span class="answer-pill ${r.correct_option?'':'dangerText'}">${r.correct_option?`Answer: ${esc(r.correct_option)}`:'Answer: Review pending'}</span></div>${imgs.map(u=>`<img src="${u}" alt="Question ${esc(r.number)} original PDF formatting preview">`).join('')}<div class="question-copy top12"><b>Text used for search/accessibility:</b> ${esc(r.question||'Visual question')}</div>${r.options.some(Boolean)?`<div class="small top12">${r.options.map((o,j)=>`<div><b>${String.fromCharCode(65+j)}.</b> ${esc(o||'')}</div>`).join('')}</div>`:''}</article>`);prog.textContent=`Preview ${i+1}/${sample.length} prepared…`;}
 box.innerHTML=`<div class="success">Detected <b>${records.length}</b> question(s). Answers matched: <b>${matched}</b>. Only teacher-visible answers are retained for grading.</div><div class="notice top12">The large visual preview below is taken from the original PDF pages, so diagrams, equations and layout are preserved. The system strips document headers/section labels from the stored question text.</div><div class="preview-grid top12">${cards.join('')}</div><div class="row gap top16"><button class="btn primary" id="importVerified">Import ${records.length} Questions</button><button class="btn secondary" id="cancelImport">Cancel</button></div><div id="importCommitMsg" class="muted small top12"></div>`;
 document.getElementById('cancelImport').onclick=()=>renderTeacher();document.getElementById('importVerified').onclick=importPdfRecords;
 }catch(e){box.innerHTML=`<div class="error">${esc(e.message||String(e))}</div>`;prog.textContent='';}
}
async function importPdfRecords(){
 const x=window.__pdfImport;if(!x)return;const box=document.getElementById('importCommitMsg');const records=x.records;const matched=records.filter(r=>r.correct_option).length;if(!matched){box.textContent='No verified answers found. Import cancelled.';return;}if(matched<records.length&&!confirm(`${records.length-matched} question(s) have no matched answer. Import only the ${matched} matched questions?`))return;
 let done=0;for(const r of records){if(!r.correct_option)continue;box.textContent=`Importing ${done+1} of ${matched}…`;
  let imagePaths=[];try{for(const c of r.pageChunks){const crop=await renderCrop(c.page.page,c.fromY,c.toY);const blob=await new Promise(res=>crop.toBlob(res,'image/webp',.95));if(blob){const path=`${profile.id}/${crypto.randomUUID()}.webp`;const up=await sb.storage.from('question-assets').upload(path,blob,{contentType:'image/webp',upsert:false});if(up.error)throw up.error;imagePaths.push(path);}}}catch(e){console.warn('Image upload skipped for question',r.number,e);}
  const ins=await sb.from('questions').insert({source_question_number:String(r.number),question_text:r.question||'Visual question',option_a:r.options[0]||'',option_b:r.options[1]||'',option_c:r.options[2]||'',option_d:r.options[3]||'',question_image_paths:imagePaths,display_mode:imagePaths.length?'image':'text',marks:1,negative_marks:0,created_by:profile.id,is_active:true}).select('id').single();if(ins.error){box.textContent=`Question ${r.number} failed: ${ins.error.message}`;break;}
  const qa=await sb.from('question_answers').insert({question_id:ins.data.id,correct_option:r.correct_option,explanation:null});if(qa.error){await sb.from('questions').delete().eq('id',ins.data.id);if(imagePaths.length)await sb.storage.from('question-assets').remove(imagePaths);box.textContent=`Answer for question ${r.number} failed: ${qa.error.message}`;break;}done++;}
 box.textContent=`Imported ${done} question(s) successfully.`;await renderTeacher();
}

function teacherTests(){return `<section class="card"><h2>Create & Assign Test</h2>${state.teacher.questions.length&&state.teacher.students.length?`<div class="grid2"><label>Test title<input id="tTitle" placeholder="Biology Test 01"></label><label>Duration (minutes)<input id="tDuration" type="number" min="1" value="180"></label><label>Default marks per question<input id="tMarks" type="number" min="0" step="0.25" value="4"></label><label>Negative marks per wrong answer<input id="tNeg" type="number" min="0" step="0.25" value="1"></label><label>Assign to students<select id="tStudents" multiple size="4">${state.teacher.students.map(s=>`<option value="${s.id}">${esc(s.full_name||'Student')} · ${esc(s.user_code||'')}</option>`).join('')}</select></label><label>Instructions<textarea id="tInstructions" placeholder="Instructions for candidates"></textarea></label></div><div class="toolbar top16"><input id="testSearch" placeholder="Filter questions by number/text"><div class="row gap"><button class="btn secondary sm" id="selectAllQs">Select all</button><button class="btn secondary sm" id="clearAllQs">Clear all</button></div></div><h3>Select Questions (<span id="selectedCount">0</span> selected / ${state.teacher.questions.length} available)</h3><div id="pickList" class="pick-list">${renderPickList()}</div><div class="row gap top16"><button class="btn primary" id="createTest">Create & Assign Test</button></div><p id="testMsg" class="muted"></p>`:`<div class="notice">${!state.teacher.questions.length?'Add verified questions first. ':''}${!state.teacher.students.length?'No students are available.':''}</div>`}</section>`;}
function renderPickList(){const term=(document.getElementById('testSearch')?.value||'').toLowerCase().trim();return state.teacher.questions.filter(q=>(`${q.source_question_number||''} ${q.question_text||''}`).toLowerCase().includes(term)).map((q,i)=>`<label class="pick"><input class="tq" type="checkbox" value="${q.id}" onchange="document.getElementById('selectedCount').textContent=document.querySelectorAll('.tq:checked').length"><span><b>${esc(q.source_question_number||i+1)}.</b> ${esc((q.question_text||'Visual question').slice(0,260))}</span></label>`).join('')||empty('No matching questions.');}
async function createTest(){const title=document.getElementById('tTitle').value.trim(),duration=Number(document.getElementById('tDuration').value),marks=Number(document.getElementById('tMarks').value),neg=Number(document.getElementById('tNeg').value),instructions=document.getElementById('tInstructions').value.trim(),students=[...document.getElementById('tStudents').selectedOptions].map(o=>o.value),qids=[...document.querySelectorAll('.tq:checked')].map(x=>x.value),msg=document.getElementById('testMsg');if(!title||!duration||!qids.length||!students.length){msg.textContent='Enter test details, select at least one student, and select questions.';return;}msg.textContent='Creating test…';const ins=await sb.from('tests').insert({title,description:instructions,duration_minutes:duration,default_marks:marks,default_negative_marks:neg,is_published:true,created_by:profile.id}).select('id').single();if(ins.error){msg.textContent=ins.error.message;return;}const tq=qids.map((question_id,i)=>({test_id:ins.data.id,question_id,question_order:i+1,marks,negative_marks:neg}));const tqr=await sb.from('test_questions').insert(tq);if(tqr.error){await sb.from('tests').delete().eq('id',ins.data.id);msg.textContent=tqr.error.message;return;}const ar=await sb.from('test_assignments').insert(students.map(student_id=>({test_id:ins.data.id,student_id,assigned_by:profile.id,status:'assigned'})));if(ar.error){msg.textContent=ar.error.message;return;}msg.textContent=`Created and assigned successfully.`;await renderTeacher();}
function teacherStudents(){return `<section class="card"><h2>Students</h2><div class="table-wrap"><table><thead><tr><th>Student ID</th><th>Name</th><th>Tests Completed</th></tr></thead><tbody>${state.teacher.students.map(s=>`<tr><td>${esc(s.user_code||'')}</td><td>${esc(s.full_name||'')}</td><td>${state.teacher.reports.filter(r=>r.student_id===s.id).length}</td></tr>`).join('')||`<tr><td colspan="3">${empty('No students found.')}</td></tr>`}</tbody></table></div></section>`;}
function teacherReports(){return `<section class="card"><h2>Performance Reports</h2><div class="table-wrap"><table><thead><tr><th>Student</th><th>Test</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Accuracy</th><th>Submitted</th><th></th></tr></thead><tbody>${state.teacher.reports.map(x=>`<tr><td>${esc(x.student_name||'')} · ${esc(x.student_code||'')}</td><td>${esc(x.test_title||'')}</td><td>${num(x.score)}/${num(x.total_marks)}</td><td>${x.correct_count}</td><td>${x.wrong_count}</td><td>${x.skipped_count}</td><td>${num(x.accuracy)}%</td><td>${fmt(x.submitted_at)}</td><td><button class="btn secondary sm" data-attempt="${x.attempt_id}">Details</button></td></tr>`).join('')||`<tr><td colspan="9">${empty('No completed attempts yet.')}</td></tr>`}</tbody></table></div></section>`;}
async function showTeacherAttempt(id){const {data:a}=await sb.from('attempts').select('id,test_id,student_id,score,total_marks,correct_count,wrong_count,skipped_count,accuracy,submitted_at').eq('id',id).single();if(!a)return;const {data:rows}=await sb.from('attempt_answers').select('question_id,selected_option,marks_awarded').eq('attempt_id',id);const qids=(rows||[]).map(x=>x.question_id);const [qs,ans]=await Promise.all([sb.from('questions').select('id,source_question_number,question_text').in('id',qids),sb.from('question_answers').select('question_id,correct_option').in('question_id',qids)]);const amap=new Map((ans.data||[]).map(x=>[x.question_id,x.correct_option]));const qmap=new Map((qs.data||[]).map(x=>[x.id,x]));const content=`<div class="kpi"><div class="item"><b>Score</b><br>${num(a.score)}/${num(a.total_marks)}</div><div class="item"><b>Correct</b><br>${a.correct_count}</div><div class="item"><b>Wrong</b><br>${a.wrong_count}</div><div class="item"><b>Skipped</b><br>${a.skipped_count}</div></div><div class="table-wrap top16"><table><thead><tr><th>Q</th><th>Question</th><th>Student</th><th>Correct</th><th>Result</th></tr></thead><tbody>${(rows||[]).map(r=>{const q=qmap.get(r.question_id);const c=amap.get(r.question_id);const result=!r.selected_option?'Skipped':r.selected_option===c?'Correct':'Wrong';return `<tr><td>${esc(q?.source_question_number||'')}</td><td>${esc(q?.question_text||'')}</td><td>${esc(r.selected_option||'—')}</td><td>${esc(c||'—')}</td><td>${result}</td></tr>`}).join('')}</tbody></table></div>`;document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="teacherModal"><div class="modal"><div class="section-title"><h2>Attempt Details</h2><button class="btn secondary" id="closeTeacherModal">Close</button></div>${content}</div></div>`);document.getElementById('closeTeacherModal').onclick=()=>document.getElementById('teacherModal')?.remove();}
function accountPanel(){return `<section class="card login-card"><h2>My Account</h2><p class="muted">ID: <b>${esc(profile.user_code||'')}</b></p><label>New password<input id="newPw" type="password" placeholder="At least 6 characters"></label><button class="btn primary top16" id="savePw">Change Password</button><p id="pwMsg" class="muted"></p></section>`;}
async function changePassword(){const p=document.getElementById('newPw').value,msg=document.getElementById('pwMsg');if(p.length<6){msg.textContent='Use at least 6 characters.';return;}const {error}=await sb.auth.updateUser({password:p});msg.textContent=error?error.message:'Password changed successfully.';}

async function renderStudent(){const [{data:tests,error:te},{data:prog,error:pe}]=await Promise.all([sb.rpc('get_student_tests'),sb.from('my_progress').select('*').order('submitted_at',{ascending:false})]);state.student.tests=tests||[];state.student.progress=prog||[];if(te)console.warn(te);if(pe)console.warn(pe);if(state.tab==='exam')return renderExam();let body=nav([['dashboard','Dashboard'],['tests','My Tests'],['progress','My Progress'],['account','My Account']]);if(state.tab==='dashboard')body+=studentDashboard();if(state.tab==='tests')body+=studentTests();if(state.tab==='progress')body+=studentProgress();if(state.tab==='account')body+=accountPanel();app.innerHTML=shell('Student Dashboard',`Welcome, ${profile.full_name||'Student'} · ${profile.user_code||'S001'}`,body,btn('Logout','logout','secondary'));bindTabs();document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startTest(b.dataset.start));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>viewStudentReport(b.dataset.report));}
function studentDashboard(){const p=state.student.progress,correct=p.reduce((a,x)=>a+Number(x.correct_count||0),0),wrong=p.reduce((a,x)=>a+Number(x.wrong_count||0),0),skipped=p.reduce((a,x)=>a+Number(x.skipped_count||0),0),attempted=correct+wrong,acc=attempted?(correct/attempted)*100:0;return `<section class="stats"><div class="card stat"><div class="muted">Tests Taken</div><strong>${p.length}</strong></div><div class="card stat"><div class="muted">Correct</div><strong>${correct}</strong></div><div class="card stat"><div class="muted">Wrong</div><strong>${wrong}</strong></div><div class="card stat"><div class="muted">Accuracy</div><strong>${acc.toFixed(1)}%</strong></div></section><section class="card"><h2>My Progress</h2><p class="muted">Only your own performance is visible here.</p><div class="progressbar"><span style="width:${Math.min(100,acc)}%"></span></div><p class="small muted top12">Total skipped: ${skipped}</p></section>`;}
function studentTests(){return `<section class="card"><h2>My Tests</h2>${state.student.tests.map(t=>`<div class="card top12"><div class="section-title"><div><h3>${esc(t.title)}</h3><p class="muted">${t.question_count} questions · ${t.duration_minutes} min</p></div><button class="btn primary" ${t.completed?'data-report': 'data-start'}="${t.id}">${t.completed?'View Report':'Start Test'}</button></div>${t.completed?`<p class="small muted">Completed ${fmt(t.submitted_at)}</p>`:''}</div>`).join('')||empty('No tests assigned yet.')}</section>`;}
function studentProgress(){return `<section class="card"><h2>Past Tests & Progress</h2><div class="table-wrap"><table><thead><tr><th>Test</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Accuracy</th><th>Date</th></tr></thead><tbody>${state.student.progress.map(x=>`<tr><td>${esc(x.test_title)}</td><td>${num(x.score)}/${num(x.total_marks)}</td><td>${x.correct_count}</td><td>${x.wrong_count}</td><td>${x.skipped_count}</td><td>${num(x.accuracy)}%</td><td>${fmt(x.submitted_at)}</td></tr>`).join('')||`<tr><td colspan="7">${empty('No completed tests yet.')}</td></tr>`}</tbody></table></div></section>`;}

async function viewStudentReport(testId){const a=state.student.progress.find(x=>x.test_id===testId);if(!a)return;const {data:rows}=await sb.from('attempt_answers').select('question_id,selected_option').eq('attempt_id',a.attempt_id);const qids=(rows||[]).map(x=>x.question_id);const {data:qs}=await sb.from('questions').select('id,source_question_number,question_text').in('id',qids);const qmap=new Map((qs||[]).map(q=>[q.id,q]));document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="studentModal"><div class="modal"><div class="section-title"><h2>${esc(a.test_title)} — Review</h2><button class="btn secondary" id="closeStudentModal">Close</button></div><div class="kpi"><div class="item"><b>Score</b><br>${num(a.score)}/${num(a.total_marks)}</div><div class="item"><b>Correct</b><br>${a.correct_count}</div><div class="item"><b>Wrong</b><br>${a.wrong_count}</div><div class="item"><b>Skipped</b><br>${a.skipped_count}</div></div><div class="table-wrap top16"><table><thead><tr><th>Q</th><th>Question</th><th>Your Answer</th><th>Status</th></tr></thead><tbody>${(rows||[]).map(r=>{const q=qmap.get(r.question_id);const status=!r.selected_option?'Skipped':'See result';return `<tr><td>${esc(q?.source_question_number||'')}</td><td>${esc(q?.question_text||'')}</td><td>${esc(r.selected_option||'—')}</td><td>${status}</td></tr>`}).join('')}</tbody></table></div></div></div>`);document.getElementById('closeStudentModal').onclick=()=>document.getElementById('studentModal')?.remove();}
async function startTest(testId){const {data:assignment,error:ae}=await sb.from('test_assignments').select('id').eq('test_id',testId).eq('student_id',profile.id).single();if(ae||!assignment){alert('This test is not assigned to your account.');return;}let {data:attempt}=await sb.from('attempts').select('id,started_at').eq('test_id',testId).eq('student_id',profile.id).is('submitted_at',null).maybeSingle();if(!attempt){const ins=await sb.from('attempts').insert({assignment_id:assignment.id,student_id:profile.id,test_id:testId,total_questions:0}).select('id,started_at').single();if(ins.error){alert(ins.error.message);return;}attempt=ins.data;}const {data:qs,error}=await sb.rpc('get_student_test_questions',{p_test_id:testId});if(error){alert(error.message);return;}const {data:t}=await sb.from('tests').select('id,title,duration_minutes').eq('id',testId).single();const {data:saved}=await sb.from('attempt_answers').select('question_id,selected_option,marked_for_review').eq('attempt_id',attempt.id);const answers={},marked={};for(const x of saved||[]){if(x.selected_option)answers[x.question_id]=x.selected_option;marked[x.question_id]=!!x.marked_for_review;}state.attempt={id:attempt.id,testId,title:t.title,duration:t.duration_minutes,questions:qs||[],answers,marked,index:0,startedAt:attempt.started_at};state.tab='exam';renderExam();}
function getQuestionImageUrl(path){return sb.storage.from('question-assets').getPublicUrl(path).data.publicUrl;}
function renderExam(){clearInterval(timer);const a=state.attempt;if(!a){state.tab='dashboard';return renderStudent();}const q=a.questions[a.index];const img=(q.question_image_paths||[])[0];const body=`<div class="exam-head"><div><b>${esc(a.title)}</b><div class="muted">Question ${a.index+1} of ${a.questions.length}</div></div><div id="timer" class="timer">--:--</div></div><div class="exam-grid"><section class="card">${img?`<img class="question-image" src="${getQuestionImageUrl(img)}" alt="Question ${a.index+1}">`:''}<div class="question-copy top16"><b>Question ${esc(q.question_order||a.index+1)}.</b> ${esc(q.question_text||'')}</div><div class="choice-list">${['A','B','C','D'].map((l,i)=>`<label class="choice ${a.answers[q.id]===l?'selected':''}"><input type="radio" name="answer" value="${l}" ${a.answers[q.id]===l?'checked':''}><span><b>${l}.</b> ${esc([q.option_a,q.option_b,q.option_c,q.option_d][i]||'')}</span></label>`).join('')}</div><div class="row gap top20"><button class="btn secondary" id="prev" ${a.index===0?'disabled':''}>Previous</button><button class="btn secondary" id="clear">Clear Response</button><button class="btn warn" id="mark">${a.marked[q.id]?'Unmark Review':'Mark for Review'}</button><button class="btn primary" id="next">${a.index===a.questions.length-1?'Submit Test':'Save & Next'}</button></div></section><aside class="card"><h3>Question Palette</h3><div class="palette">${a.questions.map((x,i)=>`<button class="qnum ${a.answers[x.id]?'answered':''} ${a.marked[x.id]?'review':''} ${i===a.index?'current':''}" data-i="${i}">${i+1}</button>`).join('')}</div><div class="legend"><span class="badge good">Answered</span><span class="badge warn">Review</span></div></aside></div>`;app.innerHTML=`<header class="topbar"><div class="brand">RUDRAKSH CBT EXAMINATION</div><div><button class="btn danger" id="examSubmit">Submit Test</button></div></header><main class="container">${body}</main>`;document.querySelectorAll('[name="answer"]').forEach(r=>r.onchange=()=>saveAnswer(q.id,r.value));document.getElementById('prev').onclick=()=>{a.index--;renderExam();};document.getElementById('clear').onclick=()=>saveAnswer(q.id,null);document.getElementById('mark').onclick=async()=>{a.marked[q.id]=!a.marked[q.id];await syncAnswer(q.id);renderExam();};document.getElementById('next').onclick=()=>a.index===a.questions.length-1?submitExam(false):(a.index++,renderExam());document.getElementById('examSubmit').onclick=()=>submitExam(false);document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{a.index=Number(b.dataset.i);renderExam();});timer=setInterval(()=>updateTimer(a),1000);updateTimer(a);}
async function syncAnswer(qid){const a=state.attempt;await sb.from('attempt_answers').upsert({attempt_id:a.id,question_id:qid,selected_option:a.answers[qid]||null,marked_for_review:!!a.marked[qid],answered_at:a.answers[qid]?new Date().toISOString():null},{onConflict:'attempt_id,question_id'});}
async function saveAnswer(qid,val){const a=state.attempt;if(val)a.answers[qid]=val;else delete a.answers[qid];await syncAnswer(qid);renderExam();}
function updateTimer(a){const left=Math.max(0,a.duration*60000-(Date.now()-new Date(a.startedAt).getTime()));const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;const el=document.getElementById('timer');if(el)el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(left<=0){clearInterval(timer);submitExam(true);}}
async function submitExam(auto){if(!state.attempt)return;if(!auto&&!confirm('Submit this test now?'))return;const {data,error}=await sb.rpc('submit_attempt',{p_attempt_id:state.attempt.id});if(error){alert(error.message);return;}clearInterval(timer);const r=data||{};state.attempt=null;state.tab='progress';alert(auto?'Time expired. Test auto-submitted.':`Test submitted. Score: ${num(r.score)}/${num(r.total_marks)}`);await renderStudent();}

boot();
