<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUDRAKSH CBT EXAMINATION</title>
<style>
:root{--navy:#123765;--blue:#2667dc;--bg:#f4f7fb;--card:#fff;--border:#d9e2ef;--text:#13243f;--muted:#65748e;--good:#157347;--warn:#9a6500;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{background:var(--navy);color:#fff;min-height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:50}.brand{font-size:22px;font-weight:800}.container{max-width:1280px;margin:0 auto;padding:24px 18px 56px}.hero{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px;box-shadow:0 8px 24px rgba(18,55,101,.06)}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(18,55,101,.05);margin-top:16px}.login-card{max-width:460px;margin:56px auto}.muted{color:var(--muted)}.small{font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tab{border:1px solid var(--border);background:#fff;color:var(--navy);padding:9px 13px;border-radius:9px}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:#edf2f8;color:var(--navy)}.btn.warn{background:#fff3d6;color:#805400}.btn.danger{background:#ffe6e2;color:var(--danger)}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;align-items:center}.gap{gap:9px}.wrap{flex-wrap:wrap}.between{justify-content:space-between}.top12{margin-top:12px}.top16{margin-top:16px}.top20{margin-top:20px}label{display:block;font-weight:600;margin-top:12px}input,select,textarea{width:100%;margin-top:7px;border:1px solid var(--border);border-radius:9px;padding:10px 11px;background:#fff;color:var(--text)}textarea{min-height:100px;resize:vertical}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:5px 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{margin-top:0}.stat strong{font-size:32px;display:block;margin-top:7px}.notice{background:#fff8dc;border:1px solid #eed17f;border-radius:10px;padding:13px 14px}.success{background:#e9f7ef;border:1px solid #9bd0af;color:#155f39;border-radius:10px;padding:13px 14px}.error{background:#ffeded;border:1px solid #e4a3a3;color:#7b1f1f;border-radius:10px;padding:13px 14px}.info{background:#eef5ff;border:1px solid #b7cdf7;color:#143b78;border-radius:10px;padding:13px 14px}.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:11px;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{background:#f7f9fc}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f8;color:var(--navy);font-size:12px;font-weight:700}.badge.good{background:#e6f6ed;color:var(--good)}.badge.warn{background:#fff3d6;color:var(--warn)}.badge.danger{background:#ffe6e2;color:var(--danger)}.empty{padding:24px;text-align:center;color:var(--muted)}.pick-list{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:10px}.pick{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:500}.pick input{width:auto;margin-top:3px}.toolbar{margin-top:12px}.exam-head{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:16px}.timer{font-size:28px;font-weight:800;color:var(--navy)}.exam-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.question-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}.question-image{width:100%;display:block;border:1px solid var(--border);border-radius:10px;background:#fff}.question-text{font-size:20px;line-height:1.55;font-weight:700;white-space:pre-wrap}.options{display:grid;gap:10px;margin-top:18px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);padding:13px;border-radius:11px;font-weight:500;background:#fff}.option input{width:auto;margin-top:4px}.option.selected{background:#edf4ff;border-color:#6d9af1}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:11px}.qnum{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px}.qnum.current{outline:2px solid var(--blue)}.qnum.answered{background:#e5f5ec;border-color:#8fc9aa}.qnum.review{background:#fff3d6;border-color:#e0bd6a}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}.progressbar{height:10px;border-radius:999px;background:#edf2f8;overflow:hidden}.progressbar span{display:block;height:100%;background:var(--blue)}.preview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.preview-item{border:1px solid var(--border);border-radius:11px;padding:12px;background:#fff}.preview-item img{width:100%;display:block;border:1px solid var(--border);border-radius:8px}.preview-title{display:flex;justify-content:space-between;gap:10px;font-weight:800;margin-bottom:8px}.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{padding:12px;border:1px solid var(--border);border-radius:10px;background:#fff}.scrollbox{max-height:330px;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-top:10px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.preview-grid,.exam-grid{grid-template-columns:1fr}.brand{font-size:18px}.topbar{padding:0 14px}.kpi-grid{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<script src="config.js"></script>
<script>
const app=document.getElementById('app');
const cfg=window.RUDRAKSH_CONFIG||{};
const ready=typeof cfg.SUPABASE_URL==='string'&&cfg.SUPABASE_URL.startsWith('https://')&&typeof cfg.SUPABASE_ANON_KEY==='string'&&cfg.SUPABASE_ANON_KEY.startsWith('sb_');
const sb=ready&&window.supabase?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
let pdfjs=null, user=null, profile=null, timer=null;
const state={tab:'dashboard',import:{preview:[],answers:{},questionFile:null,answerFile:null},teacher:{questions:[],tests:[],students:[],reports:[]},student:{tests:[],progress:[]},attempt:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v).toLocaleString():'—';
const btn=(t,id='',k='primary',x='')=>`<button class="btn ${k}" id="${id}" ${x}>${t}</button>`;
const shell=(title,subtitle,body,actions='')=>`<header class="topbar"><div class="brand">RUDRAKSH CBT EXAMINATION</div><div>${actions}</div></header><main class="container"><section class="hero"><h1>${esc(title)}</h1><p>${esc(subtitle||'Professional online CBT management system')}</p></section>${body}</main>`;
async function loadPdfJs(){if(pdfjs)return pdfjs;try{pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';return pdfjs}catch(e){return null}}
function setupScreen(){app.innerHTML=shell('Online setup required','Supabase configuration is missing.',`<section class="card"><div class="notice">Keep the existing <code>config.js</code> with your working Supabase URL and publishable key.</div></section>`)}
function loginScreen(message=''){app.innerHTML=shell('Secure Login','Teacher and Student access',`<section class="card login-card"><h2>Sign in</h2><p class="muted">Use your registered email and password.</p>${message?`<div class="error">${esc(message)}</div>`:''}<label>Email address<input id="email" type="email" autocomplete="username" placeholder="Teacher / Student email"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Password"></label><div class="row gap top16">${btn('Sign in','loginBtn')}</div><p id="loginMsg" class="muted small"></p></section>`);document.getElementById('loginBtn').onclick=login}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msg=document.getElementById('loginMsg');if(!email||!password){msg.textContent='Enter email and password.';return}msg.textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;return}user=data.user;await loadProfile()}
async function boot(){if(!ready||!sb){setupScreen();return}await loadPdfJs();const {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(!user){loginScreen();return}await loadProfile()}
async function loadProfile(){const {data:p,error}=await sb.from('profiles').select('id,role,full_name,user_code').eq('id',user.id).single();if(error||!p){loginScreen('Your account exists, but its profile is not ready.');return}profile=p;state.tab='dashboard';renderApp()}
async function logout(){clearInterval(timer);await sb.auth.signOut();user=null;profile=null;state.attempt=null;loginScreen()}
function nav(items){return `<nav class="tabs">${items.map(([k,l])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</nav>`}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderApp()});const l=document.getElementById('logout');if(l)l.onclick=logout}
async function renderApp(){if(profile.role==='teacher')return renderTeacher();return renderStudent()}
async function renderTeacher(){const qs=await sb.from('questions').select('id,source_question_number,question_text,option_a,option_b,option_c,option_d,is_active,question_image_paths,display_mode,created_at').eq('is_active',true).eq('created_by',profile.id).order('created_at',{ascending:false});const qids=(qs.data||[]).map(x=>x.id);let answers=[];if(qids.length){const ar=await sb.from('question_answers').select('question_id,correct_option').in('question_id',qids);answers=ar.data||[]}const [t,s,r]=await Promise.all([sb.from('tests').select('*').eq('created_by',profile.id).order('created_at',{ascending:false}),sb.from('profiles').select('id,user_code,full_name,role').eq('role','student').order('full_name'),sb.from('teacher_attempt_report').select('*').order('submitted_at',{ascending:false})]);const verified=new Set(answers.map(x=>x.question_id));state.teacher.questions=(qs.data||[]).map(x=>({...x,answer_status:verified.has(x.id)?'verified':'review_pending'}));state.teacher.tests=t.data||[];state.teacher.students=s.data||[];state.teacher.reports=r.data||[];let body=nav([['dashboard','Dashboard'],['questions','Question Bank'],['import','Import Questions'],['tests','Create Test'],['students','Students'],['reports','Performance'],['account','My Account']]);if(state.tab==='dashboard')body+=teacherDashboard();if(state.tab==='questions')body+=teacherQuestions();if(state.tab==='import')body+=teacherImport();if(state.tab==='tests')body+=teacherTests();if(state.tab==='students')body+=teacherStudents();if(state.tab==='reports')body+=teacherReports();if(state.tab==='account')body+=accountPanel();app.innerHTML=shell('Teacher Dashboard',`Welcome, ${profile.full_name||'Teacher'} · ${profile.user_code||'T001'}`,body,btn('Logout','logout','secondary'));bindTabs();bindTeacher()}
function teacherDashboard(){return `<section class="stats"><div class="card stat"><div class="muted">Questions</div><strong>${state.teacher.questions.length}</strong></div><div class="card stat"><div class="muted">Tests</div><strong>${state.teacher.tests.length}</strong></div><div class="card stat"><div class="muted">Students</div><strong>${state.teacher.students.length}</strong></div><div class="card stat"><div class="muted">Submitted Attempts</div><strong>${state.teacher.reports.length}</strong></div></section><section class="card"><h2>Teacher Control Center</h2><div class="kpi-grid"><div class="mini"><b>Question Management</b><br><span class="muted">Import, review, edit and delete questions.</span></div><div class="mini"><b>Test Management</b><br><span class="muted">Build and assign 180–300+ question tests.</span></div><div class="mini"><b>Performance</b><br><span class="muted">See student-wise and test-wise performance.</span></div></div><div class="notice top16">The production bank starts with <b>${state.teacher.questions.length}</b> question(s). Only teacher-approved questions can enter a published test.</div></section>`}
function teacherQuestions(){return `<section class="card"><div class="section-title"><div><h2>Question Bank</h2><p class="muted">Only the question, four options and teacher-only answer are stored as the actual question record. PDF headers/section names are not used as question content.</p></div><button class="btn primary" data-tab="import">Import Questions</button></div><div class="toolbar"><input id="qSearch" placeholder="Search questions"></div><div id="qTable" class="table-wrap"></div></section>`}
function teacherImport(){return `<section class="card"><h2>Import Questions</h2><p class="muted">Upload a question PDF and an optional answer-key PDF. The importer uses question-number detection and renders each question from the original PDF region so diagrams, equations and layouts stay visually intact.</p><div class="grid2"><label>Question PDF<input id="qFile" type="file" accept="application/pdf"></label><label>Answer key PDF (optional)<input id="aFile" type="file" accept="application/pdf"></label><label>First question number<input id="rangeStart" type="number" value="1" min="1"></label><label>Last question number<input id="rangeEnd" type="number" value="999" min="1"></label></div><div class="row gap wrap top16"><button class="btn primary" id="analyzePdf">Analyze PDF</button><button class="btn secondary" id="clearImport">Clear</button></div><div id="importPreview" class="top16"></div></section>`}
function teacherTests(){const qs=state.teacher.questions.filter(q=>q.answer_status==='verified');const students=state.teacher.students;return `<section class="card"><h2>Create & Assign Test</h2>${students.length?`<div class="grid2"><label>Test title<input id="tTitle" placeholder="Biology Test 01"></label><label>Duration (minutes)<input id="tDuration" type="number" min="1" value="180"></label><label>Default marks per question<input id="tMarks" type="number" min="0" step="0.25" value="4"></label><label>Negative marks per wrong answer<input id="tNeg" type="number" min="0" step="0.25" value="1"></label><label>Assign to students<select id="tStudents" multiple size="4">${students.map(s=>`<option value="${s.id}">${esc(s.full_name||'Student')} · ${esc(s.user_code||'')}</option>`).join('')}</select></label><label>Instructions<textarea id="tInstructions" placeholder="Test instructions"></textarea></label></div><h3 class="top20">Select Questions (${qs.length} verified available)</h3><div class="row gap wrap"><button class="btn secondary" id="selectAllQ">Select all visible</button><button class="btn secondary" id="clearAllQ">Clear selection</button><span id="selectedCount" class="badge">0 selected</span></div><div class="pick-list top12">${qs.map((q,i)=>`<label class="pick"><input class="tq" type="checkbox" value="${q.id}"><span><b>${esc(q.source_question_number||String(i+1))}.</b> ${esc((q.question||'').slice(0,300))}</span></label>`).join('')||empty('Add and verify questions before creating a test.')}</div><div class="row gap top16">${btn('Create Test & Assign','createTest')}</div><p id="testMsg" class="muted"></p>`:`<div class="notice">No students are available.</div>`}</section>`}
function teacherStudents(){return `<section class="card"><h2>Students</h2><div class="table-wrap"><table><thead><tr><th>Student ID</th><th>Name</th><th>Email</th></tr></thead><tbody>${state.teacher.students.map(s=>`<tr><td>${esc(s.user_code||'')}</td><td>${esc(s.full_name||'')}</td><td class="muted">Protected by Supabase Auth</td></tr>`).join('')||`<tr><td colspan="3">${empty('No students')}</td></tr>`}</tbody></table></div></section>`}
function teacherReports(){return `<section class="card"><h2>Performance Reports</h2>${state.teacher.reports.length?`<div class="table-wrap"><table><thead><tr><th>Student</th><th>Test</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Accuracy</th><th>Submitted</th></tr></thead><tbody>${state.teacher.reports.map(r=>`<tr><td>${esc(r.student_name||'')}</td><td>${esc(r.test_title||'')}</td><td>${r.score??0}</td><td>${r.correct_count??0}</td><td>${r.wrong_count??0}</td><td>${r.skipped_count??0}</td><td>${Number(r.accuracy||0).toFixed(2)}%</td><td>${fmt(r.submitted_at)}</td></tr>`).join('')}</tbody></table></div>`:empty('No submitted attempts yet.')}</section>`}
function accountPanel(){return `<section class="card"><h2>My Account</h2><div class="grid2"><div class="mini"><b>Role</b><div class="muted">${esc(profile.role)}</div></div><div class="mini"><b>User ID</b><div class="muted">${esc(profile.user_code||'')}</div></div></div><div class="top16">${btn('Change Password','changePw','secondary')}</div><div id="pwBox"></div></section>`}
async function changePassword(){const box=document.getElementById('pwBox');box.innerHTML=`<div class="card"><label>New password<input id="newPw" type="password"></label><div class="top12">${btn('Update Password','savePw')}</div><p id="pwMsg" class="muted small"></p></div>`;document.getElementById('savePw').onclick=async()=>{const p=document.getElementById('newPw').value,msg=document.getElementById('pwMsg');if(p.length<8){msg.textContent='Use at least 8 characters.';return}const {error}=await sb.auth.updateUser({password:p});msg.textContent=error?error.message:'Password updated successfully.'}}
function renderQuestionTable(filter=''){const rows=state.teacher.questions.filter(q=>{const text=[q.source_question_number,q.question_text].join(' ').toLowerCase();return !filter||text.includes(filter.toLowerCase())});return `<table><thead><tr><th>No.</th><th>Question</th><th>Status</th><th>Manage</th></tr></thead><tbody>${rows.map(q=>{const imgs=Array.isArray(q.question_image_paths)?q.question_image_paths:[];return `<tr><td>${esc(q.source_question_number||'')}</td><td>${imgs.length?`<img src="${esc(imgs[0])}" style="max-width:320px;max-height:180px;border:1px solid #d9e2ef;border-radius:8px" alt="Question ${esc(q.source_question_number)}">`:esc(q.question_text||'')}</td><td>${q.answer_status==='verified'?'<span class="badge good">Verified</span>':'<span class="badge warn">Pending</span>'}</td><td><div class="row gap wrap">${btn('Delete','del_'+q.id,'danger')} ${q.answer_status==='verified'?'<span class="badge good">Answer secured</span>':btn('Set Answer','ans_'+q.id,'warn')}</div></td></tr>`}).join('')||`<tr><td colspan="4">${empty('No questions found.')}</td></tr>`}</tbody></table>`}
function bindTeacher(){if(state.tab==='questions'){const box=document.getElementById('qTable');box.innerHTML=renderQuestionTable();document.getElementById('qSearch').oninput=e=>box.innerHTML=renderQuestionTable(e.target.value);state.teacher.questions.forEach(q=>{const b=document.getElementById('del_'+q.id);if(b)b.onclick=()=>deleteQuestion(q.id);const a=document.getElementById('ans_'+q.id);if(a)a.onclick=()=>setAnswer(q.id)})}if(state.tab==='import'){document.getElementById('qFile').onchange=e=>state.import.questionFile=e.target.files[0]||null;document.getElementById('aFile').onchange=e=>state.import.answerFile=e.target.files[0]||null;document.getElementById('analyzePdf').onclick=analyzeImport;document.getElementById('clearImport').onclick=()=>{state.import={preview:[],answers:{},questionFile:null,answerFile:null};renderApp()}}if(state.tab==='tests'){document.getElementById('selectAllQ')?.addEventListener('click',()=>{document.querySelectorAll('.tq').forEach(c=>c.checked=true);updateSelectedCount()});document.getElementById('clearAllQ')?.addEventListener('click',()=>{document.querySelectorAll('.tq').forEach(c=>c.checked=false);updateSelectedCount()});document.querySelectorAll('.tq').forEach(c=>c.onchange=updateSelectedCount);document.getElementById('createTest')?.addEventListener('click',createTest)}}
function updateSelectedCount(){const n=document.querySelectorAll('.tq:checked').length;const s=document.getElementById('selectedCount');if(s)s.textContent=`${n} selected`}
async function deleteQuestion(id){if(!confirm('Delete this question?'))return;const {error}=await sb.from('questions').update({is_active:false}).eq('id',id).eq('created_by',profile.id);if(error)alert(error.message);else renderApp()}
async function setAnswer(id){const v=prompt('Correct answer: A, B, C or D');if(!v)return;const c=v.trim().toUpperCase();if(!['A','B','C','D'].includes(c)){alert('Use A, B, C or D.');return}const x=await sb.from('question_answers').upsert({question_id:id,correct_option:c,explanation:''},{onConflict:'question_id'});if(x.error)alert(x.error.message);else renderApp()}
function parseAnswerRows(rows){const map={};for(let i=0;i<rows.length;i++){const line=rows[i].text.trim();if(/^QUES?\b/i.test(line)){const nums=[...line.matchAll(/\b(\d{1,3})\b/g)].map(m=>Number(m[1]));const next=rows[i+1]?.text.trim()||'';const ans=[...next.matchAll(/\b([ABCD])\b/gi)].map(m=>m[1].toUpperCase());if(nums.length&&ans.length>=nums.length){nums.forEach((n,j)=>map[n]=ans[j]);continue}}const single=line.match(/^\s*(?:Q(?:UES)?\.?\s*)?(\d{1,3})\s*[-:.]?\s*(?:ANS(?:WER)?\s*[:.-]?\s*)?([ABCD])\b/i);if(single)map[Number(single[1])]=single[2].toUpperCase()}return map}
function groupTextItems(items){const rows=[];for(const it of items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]*10)/10;let row=rows.find(r=>Math.abs(r.y-y)<1.2);if(!row){row={y,items:[]};rows.push(row)}row.items.push(it)}rows.forEach(r=>r.items.sort((a,b)=>a.transform[4]-b.transform[4]));return rows.sort((a,b)=>b.y-a.y).map(r=>({y:r.y,text:r.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()}))}
function findQuestionStarts(rows,minQ,maxQ){const starts=[];for(const r of rows){const m=r.text.match(/^\s*(\d{1,3})\s*[.)]\s*/);if(m){const n=Number(m[1]);if(n>=minQ&&n<=maxQ)starts.push({number:n,y:r.y,text:r.text})}}return starts}
async function renderPage(pdf,pageNum,scale=1.35){const page=await pdf.getPage(pageNum);const viewport=page.getViewport({scale});const c=document.createElement('canvas');c.width=Math.ceil(viewport.width);c.height=Math.ceil(viewport.height);const ctx=c.getContext('2d');await page.render({canvasContext:ctx,viewport}).promise;return {page,canvas:c,viewport}}
async function cropCanvas(canvas,viewport,yTop,yBottom){const top=Math.max(0,Math.floor(yTop));const bottom=Math.min(canvas.height,Math.ceil(yBottom));const h=Math.max(10,bottom-top);const out=document.createElement('canvas');out.width=canvas.width;out.height=h;out.getContext('2d').drawImage(canvas,0,top,canvas.width,h,0,0,canvas.width,h);return out}
async function analyzeImport(){
  const out=document.getElementById('importPreview');
  out.innerHTML='';
  const qf=state.import.questionFile||document.getElementById('qFile').files[0];
  const af=state.import.answerFile||document.getElementById('aFile').files[0];
  if(!qf){out.innerHTML='<div class="error">Choose a question PDF.</div>';return;}
  const start=Number(document.getElementById('rangeStart').value)||1;
  const end=Number(document.getElementById('rangeEnd').value)||999;
  const lib=await loadPdfJs();
  if(!lib){out.innerHTML='<div class="error">PDF engine could not be loaded. Refresh once and try again.</div>';return;}
  out.innerHTML='<div class="info">Analyzing PDF… Questions are rendered from the original PDF layout so diagrams and formatting are preserved.</div>';
  try{
    let answers={};
    if(af){
      const apdf=await lib.getDocument({data:new Uint8Array(await af.arrayBuffer())}).promise;
      const arows=[];
      for(let p=1;p<=apdf.numPages;p++){
        const pg=await apdf.getPage(p);
        const tc=await pg.getTextContent();
        arows.push(...groupTextItems(tc.items));
      }
      answers=parseAnswerRows(arows);
    }
    const pdf=await lib.getDocument({data:new Uint8Array(await qf.arrayBuffer())}).promise;
    const pieces=new Map();
    let current=null;
    for(let p=1;p<=pdf.numPages;p++){
      const pg=await pdf.getPage(p);
      const tc=await pg.getTextContent();
      const rows=groupTextItems(tc.items);
      const starts=findQuestionStarts(rows,start,end);
      const rp=await renderPage(pdf,p,1.35);
      const contentTop=rp.canvas.height*0.06;
      const contentBottom=rp.canvas.height*0.94;
      const coords=starts.map(s=>{const pt=rp.viewport.convertToViewportPoint(0,s.y);return {number:s.number,y:pt[1]};}).sort((a,b)=>a.y-b.y);
      const rowsIn=(top,bottom)=>rows.filter(r=>{const pt=rp.viewport.convertToViewportPoint(0,r.y)[1];return pt>=top&&pt<=bottom}).map(r=>r.text);
      if(coords.length===0){
        if(current){
          pieces.get(current).segments.push({canvas:await cropCanvas(rp.canvas,rp.viewport,contentTop,contentBottom)});
          pieces.get(current).lines.push(...rowsIn(contentTop,contentBottom));
        }
        continue;
      }
      if(coords[0].y>contentTop+4&&current){
        const bottom=coords[0].y-6;
        pieces.get(current).segments.push({canvas:await cropCanvas(rp.canvas,rp.viewport,contentTop,bottom)});
        pieces.get(current).lines.push(...rowsIn(contentTop,bottom));
      }
      for(let i=0;i<coords.length;i++){
        const n=coords[i].number;
        if(!pieces.has(n))pieces.set(n,{number:n,segments:[],lines:[]});
        current=n;
        const top=Math.max(contentTop,coords[i].y-5);
        const bottom=i+1<coords.length?Math.max(top+10,coords[i+1].y-6):contentBottom;
        pieces.get(n).segments.push({canvas:await cropCanvas(rp.canvas,rp.viewport,top,bottom)});
        pieces.get(n).lines.push(...rowsIn(top,bottom));
      }
    }
    const preview=[];
    for(const [n,obj] of [...pieces.entries()].sort((a,b)=>a[0]-b[0])){
      if(!obj.segments.length)continue;
      const final=document.createElement('canvas');
      final.width=Math.max(...obj.segments.map(s=>s.canvas.width));
      final.height=obj.segments.reduce((a,s)=>a+s.canvas.height+6,0);
      const fctx=final.getContext('2d');
      let y=0;
      for(const seg of obj.segments){fctx.drawImage(seg.canvas,0,y);y+=seg.canvas.height+6;}
      const dataUrl=final.toDataURL('image/jpeg',.72);
      let qtext=(obj.lines||[]).join(' ').replace(/\s+/g,' ').trim();
      qtext=qtext.replace(/^\d{1,3}\s*[.)]\s*/,'');
      qtext=qtext.replace(/(?:NPT[-–—]?\d[^ ]*|The Radiant Academy|SECTION\s*[-–—]\s*[A-Z]).*?(?=\d{1,3}\.|$)/gi,'').trim().slice(0,1800);
      preview.push({number:n,image:dataUrl,correct_option:answers[n]||null,text:qtext||`Question ${n}`});
    }
    state.import.preview=preview;
    state.import.answers=answers;
    const matched=preview.filter(x=>x.correct_option).length;
    const pending=preview.length-matched;
    out.innerHTML=`<div class="success"><b>${preview.length}</b> question(s) detected. <b>${matched}</b> answer(s) matched. Nothing has been saved yet.</div><div class="row gap wrap top12"><span class="badge">Range ${esc(start)}–${esc(end)}</span><span class="badge good">Matched ${matched}</span><span class="badge warn">Pending ${pending}</span></div><div class="preview-grid">${preview.map(x=>`<div class="preview-item"><div class="preview-title"><span>Q${esc(x.number)}</span><span class="badge ${x.correct_option?'good':'warn'}">${x.correct_option?'Answer '+x.correct_option:'Pending'}</span></div><img src="${x.image}" alt="Question ${esc(x.number)} preview"></div>`).join('')}</div>${preview.length?`<div class="row gap top16">${btn(`Import ${preview.length} Questions`,'importAll')}</div>`:''}`;
    document.getElementById('importAll')?.addEventListener('click',importPreview);
  }catch(e){
    out.innerHTML=`<div class="error">PDF analysis failed: ${esc(e.message||e)}</div>`;
  }
}
async function importPreview(){const p=state.import.preview;if(!p.length)return;const out=document.getElementById('importPreview');out.innerHTML='<div class="info">Importing verified question images to the online question bank…</div>';let saved=0;for(const x of p){if(!x.correct_option)continue;const blob=await (await fetch(x.image)).blob();const path=`${profile.id}/${crypto.randomUUID()}.jpg`;const up=await sb.storage.from('question-assets').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;const pub=sb.storage.from('question-assets').getPublicUrl(path).data.publicUrl;const ins=await sb.from('questions').insert({subject:'',class_name:'',exam_name:'',chapter:'',topic:'',source_name:'',source_question_number:String(x.number),question_text:x.text||`Question ${x.number}`,option_a:'A',option_b:'B',option_c:'C',option_d:'D',marks:1,negative_marks:0,is_active:true,created_by:profile.id,question_image_paths:[pub],display_mode:'image'}).select('id').single();if(ins.error)throw ins.error;const ar=await sb.from('question_answers').upsert({question_id:ins.data.id,correct_option:x.correct_option,explanation:''},{onConflict:'question_id'});if(ar.error)throw ar.error;saved++}out.innerHTML=`<div class="success">Imported <b>${saved}</b> verified question(s). ${p.filter(x=>!x.correct_option).length} question(s) remain pending and were not imported.</div>`;state.import={preview:[],answers:{},questionFile:null,answerFile:null};await renderTeacher()}
async function createTest(){const title=document.getElementById('tTitle').value.trim(),duration=Number(document.getElementById('tDuration').value),marks=Number(document.getElementById('tMarks').value),neg=Number(document.getElementById('tNeg').value),instructions=document.getElementById('tInstructions').value.trim(),students=[...document.getElementById('tStudents').selectedOptions].map(o=>o.value),qids=[...document.querySelectorAll('.tq:checked')].map(x=>x.value),msg=document.getElementById('testMsg');if(!title||!duration||!qids.length||!students.length){msg.textContent='Enter test details, choose students and select questions.';return}msg.textContent='Creating test…';const ins=await sb.from('tests').insert({title,description:instructions,duration_minutes:duration,default_marks:marks,default_negative_marks:neg,is_published:true,created_by:profile.id}).select('id').single();if(ins.error){msg.textContent=ins.error.message;return}const tq=qids.map((question_id,i)=>({test_id:ins.data.id,question_id,question_order:i+1,marks,negative_marks:neg}));const tqr=await sb.from('test_questions').insert(tq);if(tqr.error){await sb.from('tests').delete().eq('id',ins.data.id);msg.textContent=tqr.error.message;return}const as=students.map(student_id=>({test_id:ins.data.id,student_id,assigned_by:profile.id,status:'assigned'}));const ar=await sb.from('test_assignments').insert(as);if(ar.error){msg.textContent=ar.error.message;return}msg.textContent=`Test created and assigned to ${students.length} student(s).`;state.tab='tests';await renderTeacher()}
async function renderStudent(){const [tr,pr]=await Promise.all([sb.rpc('get_student_tests'),sb.from('my_progress').select('*').order('submitted_at',{ascending:false})]);state.student.tests=tr.data||[];state.student.progress=pr.data||[];let body=nav([['dashboard','Dashboard'],['tests','My Tests'],['progress','My Progress'],['account','My Account']]);if(state.tab==='dashboard')body+=studentDashboard();if(state.tab==='tests')body+=studentTests();if(state.tab==='progress')body+=studentProgress();if(state.tab==='account')body+=accountPanel();if(state.tab==='exam')return renderExam();app.innerHTML=shell('Student Dashboard',`Welcome, ${profile.full_name||'Student'} · ${profile.user_code||'S001'}`,body,btn('Logout','logout','secondary'));bindTabs();document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startTest(b.dataset.start))}
function studentDashboard(){const p=state.student.progress,c=p.reduce((a,x)=>a+Number(x.correct_count||0),0),w=p.reduce((a,x)=>a+Number(x.wrong_count||0),0),a=c+w+ p.reduce((s,x)=>s+Number(x.skipped_count||0),0);return `<section class="stats"><div class="card stat"><div class="muted">Tests Taken</div><strong>${p.length}</strong></div><div class="card stat"><div class="muted">Correct</div><strong>${c}</strong></div><div class="card stat"><div class="muted">Wrong</div><strong>${w}</strong></div><div class="card stat"><div class="muted">Accuracy</div><strong>${a?((c/a)*100).toFixed(1):'0.0'}%</strong></div></section><section class="card"><h2>My Progress</h2><p class="muted">Your dashboard shows only your own history and performance.</p><div class="progressbar"><span style="width:${a?((c/a)*100):0}%"></span></div><p class="small muted">Total skipped: ${state.student.progress.reduce((s,x)=>s+Number(x.skipped_count||0),0)}</p></section>`}
function studentTests(){return `<section class="card"><h2>My Tests</h2>${state.student.tests.length?`<div class="table-wrap"><table><thead><tr><th>Test</th><th>Questions</th><th>Duration</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.student.tests.map(t=>`<tr><td>${esc(t.title)}</td><td>${t.question_count}</td><td>${t.duration_minutes} min</td><td>${t.completed?'<span class="badge good">Completed</span>':'<span class="badge warn">Assigned</span>'}</td><td>${t.completed?'<span class="muted">Completed</span>':btn('Start Test','start_'+t.id)}</td></tr>`).join('')}</tbody></table></div>`:empty('No tests assigned yet.')}</section>`}
function studentProgress(){return `<section class="card"><h2>My Progress</h2>${state.student.progress.length?`<div class="table-wrap"><table><thead><tr><th>Test</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Accuracy</th><th>Submitted</th></tr></thead><tbody>${state.student.progress.map(x=>`<tr><td>${esc(x.test_title||'')}</td><td>${x.score??0}</td><td>${x.correct_count??0}</td><td>${x.wrong_count??0}</td><td>${x.skipped_count??0}</td><td>${Number(x.accuracy||0).toFixed(2)}%</td><td>${fmt(x.submitted_at)}</td></tr>`).join('')}</tbody></table></div>`:empty('No completed tests yet.')}</section>`}
async function startTest(testId){const ass=await sb.from('test_assignments').select('id').eq('test_id',testId).eq('student_id',profile.id).single();if(ass.error){alert(ass.error.message);return}const existing=await sb.from('attempts').select('id,started_at,submitted_at').eq('test_id',testId).eq('student_id',profile.id).is('submitted_at',null).maybeSingle();let attempt=existing.data;if(!attempt){const ins=await sb.from('attempts').insert({assignment_id:ass.data.id,student_id:profile.id,test_id:testId,total_questions:0,status:'in_progress'}).select('id,started_at').single();if(ins.error){alert(ins.error.message);return}attempt=ins.data}const {data:qs,error}=await sb.rpc('get_student_test_questions',{p_test_id:testId});if(error){alert(error.message);return}const {data:t,error:te}=await sb.from('tests').select('id,title,duration_minutes').eq('id',testId).single();if(te){alert(te.message);return}const {data:saved}=await sb.from('attempt_answers').select('question_id,selected_option,marked_for_review').eq('attempt_id',attempt.id);const answers={},marked={};(saved||[]).forEach(x=>{if(x.selected_option)answers[x.question_id]=x.selected_option;marked[x.question_id]=!!x.marked_for_review});state.attempt={id:attempt.id,testId,title:t.title,duration:t.duration_minutes,questions:qs||[],index:0,answers,marked,startedAt:attempt.started_at};state.tab='exam';renderExam()}
function renderExam(){clearInterval(timer);const a=state.attempt;if(!a){state.tab='tests';renderApp();return}const q=a.questions[a.index];if(!q){state.tab='tests';renderApp();return}const letters=['A','B','C','D'];const rem=Math.max(0,Math.floor((a.duration*60-(Date.now()-new Date(a.startedAt).getTime())/1000)));const mins=Math.floor(rem/60),secs=rem%60;app.innerHTML=`<header class="topbar"><div class="brand">RUDRAKSH CBT EXAMINATION</div><div class="timer" id="timer">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div></header><main class="container"><div class="exam-head"><div><b>${esc(a.title)}</b><div class="muted">Question ${a.index+1} of ${a.questions.length}</div></div><div class="row gap">${btn('Submit Test','submitExam','danger')}</div></div><div class="exam-grid"><section class="question-card">${Array.isArray(q.question_image_paths)&&q.question_image_paths.length?q.question_image_paths.map(u=>`<img class="question-image" style="margin-bottom:10px" src="${esc(u)}" alt="Question ${a.index+1}">`).join(''):`<div class="question-text">${esc(q.question_text||'')}</div>`}<div class="options">${letters.map(l=>`<label class="option ${a.answers[q.id]===l?'selected':''}"><input type="radio" name="opt" value="${l}" ${a.answers[q.id]===l?'checked':''}> <span><b>${l}.</b></span></label>`).join('')}</div><div class="row gap between top16 wrap">${btn('Previous','prevQ','secondary',''+(a.index===0?'disabled':''))}${btn(a.index===a.questions.length-1?'Finish':'Next','nextQ')}</div></section><aside class="card"><h3>Question Palette</h3><div class="palette">${a.questions.map((qq,i)=>`<button class="qnum ${i===a.index?'current':''} ${a.answers[qq.id]?'answered':''} ${a.marked[qq.id]?'review':''}" data-q="${i}">${i+1}</button>`).join('')}</div><div class="legend"><span class="badge">Answered</span><span class="badge warn">Review</span></div></aside></div></main>`;const radio=[...document.querySelectorAll('input[name="opt"]')];radio.forEach(r=>r.onchange=async()=>{a.answers[q.id]=r.value;await saveAnswer(q.id,r.value)});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{a.index=Number(b.dataset.q);renderExam()});document.getElementById('prevQ')?.addEventListener('click',()=>{if(a.index>0){a.index--;renderExam()}});document.getElementById('nextQ').onclick=()=>{if(a.index<a.questions.length-1){a.index++;renderExam()}else submitExam()};document.getElementById('submitExam').onclick=()=>submitExam();timer=setInterval(()=>{const node=document.getElementById('timer');if(!node)return;const r2=Math.max(0,Math.floor((a.duration*60-(Date.now()-new Date(a.startedAt).getTime())/1000)));node.textContent=`${String(Math.floor(r2/60)).padStart(2,'0')}:${String(r2%60).padStart(2,'0')}`;if(r2<=0){clearInterval(timer);submitExam(true)}},1000)}
async function saveAnswer(qid,selected){const ex=await sb.from('attempt_answers').upsert({attempt_id:state.attempt.id,question_id:qid,selected_option:selected,marked_for_review:false},{onConflict:'attempt_id,question_id'});if(ex.error)console.error(ex.error)}
async function submitExam(auto=false){if(!state.attempt)return;if(!auto&&!confirm('Submit your test now?'))return;clearInterval(timer);const {data,error}=await sb.rpc('submit_attempt',{p_attempt_id:state.attempt.id});if(error){alert(error.message);return}state.attempt.result=data;state.tab='progress';await renderStudent();alert(`Test submitted. Score: ${data.score}, Accuracy: ${Number(data.accuracy||0).toFixed(2)}%`)}
boot();
</script></body></html>
