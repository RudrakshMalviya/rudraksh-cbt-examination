<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUDRAKSH CBT EXAMINATION</title>
<style>
:root{--navy:#123765;--blue:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#10233f;--muted:#60708c;--line:#dbe4f0;--good:#16834b;--warn:#9a6100;--bad:#b42318;--soft:#edf4ff;--shadow:0 8px 28px rgba(16,35,63,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:60px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:40}.brand{font-size:20px;font-weight:850;letter-spacing:.1px}.container{max-width:1200px;margin:0 auto;padding:20px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:22px;margin-bottom:14px}.hero h1{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.tab,.btn{border:1px solid #cbd8ea;border-radius:10px;background:#fff;color:var(--navy);padding:9px 13px}.tab.active,.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.secondary{background:#fff}.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}.btn.warn{background:#fff4dc;border-color:#e3bd79;color:#7b4a00}.btn.sm{padding:6px 10px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px}.stat .label{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:700}.field input,.field textarea,.field select,input[type=file]{width:100%;border:1px solid #cbd8ea;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text)}textarea{min-height:110px;resize:vertical}.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.space{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:13px}.notice,.success,.error{padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#f7f9fc}.success{background:#edf9f2;border-color:#a6dcb9;color:#175f3a}.error{background:#fff0ef;border-color:#efb4ae;color:#8c1e16}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{background:#f6f8fb}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.good{background:#e8f7ef;color:var(--good)}.warnb{background:#fff1dc;color:var(--warn)}.badb{background:#fde9e7;color:var(--bad)}.preview-grid{display:grid;grid-template-columns:1fr;gap:12px}.preview-card{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.preview-img{display:block;width:100%;max-height:540px;object-fit:contain;background:#f8fafc;border:1px solid var(--line);border-radius:10px;margin-top:10px}.preview-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfcfe}.pick-list{display:grid;gap:8px;max-height:540px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px}.pick{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;border:1px solid #e7edf5;border-radius:10px;padding:10px;background:#fbfcfe}.pick .thumb{width:170px;max-height:110px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}.modal-backdrop{position:fixed;inset:0;background:rgba(7,24,49,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modal{max-width:1050px;width:100%;max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;border:1px solid var(--line)}.exam-top{position:sticky;top:60px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}.timer{font-size:24px;font-weight:850}.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}.exam-image{width:100%;max-height:720px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff}.answer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.ans-btn{border:1px solid #cbd8ea;border-radius:12px;padding:14px;background:#fff;text-align:center;font-weight:800}.ans-btn.selected{border-color:var(--blue);background:var(--soft);box-shadow:0 0 0 2px rgba(37,99,235,.08)}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qnum{padding:8px;border:1px solid #cbd8ea;border-radius:8px;background:#fff}.qnum.current{outline:2px solid var(--blue)}.qnum.answered{background:#e8f7ef;border-color:#a6dcb9}.qnum.review{box-shadow:inset 0 -3px 0 #e3a33b}.progress{height:12px;background:#e9eff7;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue)}.empty{text-align:center;color:var(--muted);padding:28px}.hidden{display:none!important}.sticky-actions{position:sticky;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:14px;box-shadow:var(--shadow)}@media(max-width:900px){.stats,.kpis{grid-template-columns:1fr 1fr}.grid2,.grid3,.exam-grid{grid-template-columns:1fr}.answer-grid{grid-template-columns:1fr 1fr}.container{padding:14px}.palette{grid-template-columns:repeat(7,1fr)}.pick{grid-template-columns:auto 1fr}.pick .thumb{width:120px}.topbar{padding:0 14px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';

const {createClient}=window.supabase;
const cfg=window.RUDRAKSH_CONFIG||{};
const app=document.getElementById('app');
const ready=typeof cfg.SUPABASE_URL==='string'&&cfg.SUPABASE_URL.startsWith('https://')&&typeof cfg.SUPABASE_ANON_KEY==='string'&&cfg.SUPABASE_ANON_KEY.startsWith('sb_');
const sb=ready?createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
let user=null,profile=null,timer=null;
const state={tab:'dashboard',teacher:{questions:[],students:[],tests:[],reports:[]},student:{tests:[],progress:[]},preview:[],previewPage:1,attempt:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(v).toLocaleString():'—';
const num=v=>Number(v||0).toFixed(2).replace(/\.00$/,'');
const top=actions=>`<header class="topbar"><div class="brand">RUDRAKSH CBT EXAMINATION</div><div>${actions||''}</div></header>`;
const shell=(title,subtitle,body,actions='')=>`${top(actions)}<main class="container"><section class="hero"><h1>${esc(title)}</h1><p>${esc(subtitle||'Professional online CBT management system')}</p></section>${body}</main>`;
const btn=(t,id='',kind='primary',attrs='')=>`<button class="btn ${kind}" id="${id}" ${attrs}>${t}</button>`;
function navTeacher(){return `<nav class="tabs">${[['dashboard','Dashboard'],['questions','Question Bank'],['import','Import Questions'],['tests','Create Test'],['students','Students'],['reports','Performance'],['account','My Account']].map(([k,l])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</nav>`}
function navStudent(){return `<nav class="tabs">${[['dashboard','Dashboard'],['tests','My Tests'],['progress','My Progress'],['account','My Account']].map(([k,l])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${l}</button>`).join('')}</nav>`}
function bindNav(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{state.tab=b.dataset.tab;await render();})}
async function boot(){if(!ready){app.innerHTML=shell('RUDRAKSH CBT EXAMINATION','Online setup required',`<section class="card"><div class="error">Supabase configuration is missing. Keep your working <code>config.js</code> with the project URL and publishable key.</div></section>`);return;}const {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(!user){return login();}await loadProfile();}
function login(msg=''){app.innerHTML=shell('Secure Login','Teacher and Student access',`<section class="card" style="max-width:440px;margin:30px auto"><h2>Sign in</h2><p class="muted">Use your registered email and password.</p>${msg?`<div class="error">${esc(msg)}</div>`:''}<label class="field"><span>Email address</span><input id="email" type="email" autocomplete="username" placeholder="Teacher / Student email"></label><label class="field" style="margin-top:14px"><span>Password</span><input id="password" type="password" autocomplete="current-password" placeholder="Password"></label><div class="row" style="margin-top:14px">${btn('Sign in','loginBtn')}</div><p id="loginMsg" class="muted small"></p></section>`);document.getElementById('loginBtn').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,msgEl=document.getElementById('loginMsg');msgEl.textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){msgEl.textContent=error.message;return;}user=data.user;await loadProfile();};}
async function loadProfile(){const {data,error}=await sb.from('profiles').select('id,role,full_name,user_code').eq('id',user.id).single();if(error||!data){return login('Your account profile is not ready.');}profile=data;state.tab='dashboard';await render();}
async function logout(){clearInterval(timer);await sb.auth.signOut();user=null;profile=null;state.attempt=null;state.preview=[];login();}
async function render(){if(profile.role==='teacher')return renderTeacher();return renderStudent();}
async function renderTeacher(){const [q,s,t,r]=await Promise.all([sb.from('questions').select('id,source_question_number,question_text,question_image_paths,display_mode,created_at').eq('is_active',true).order('created_at',{ascending:false}),sb.from('profiles').select('id,full_name,user_code').eq('role','student').order('full_name'),sb.from('tests').select('id,title,duration_minutes,is_published,created_at').order('created_at',{ascending:false}),sb.from('teacher_attempt_report').select('*').order('submitted_at',{ascending:false})]);state.teacher.questions=q.data||[];state.teacher.students=s.data||[];state.teacher.tests=t.data||[];state.teacher.reports=r.data||[];if(state.tab==='dashboard')teacherDash();else if(state.tab==='questions')teacherQuestions();else if(state.tab==='import')teacherImport();else if(state.tab==='tests')teacherTests();else if(state.tab==='students')teacherStudents();else if(state.tab==='reports')teacherReports();else teacherAccount();bindNav();bindImportPreview();}
function bindImportPreview(){document.getElementById('prevP')?.addEventListener('click',()=>{state.previewPage=Math.max(1,state.previewPage-1);renderTeacher()});document.getElementById('nextP')?.addEventListener('click',()=>{const pages=Math.max(1,Math.ceil(state.preview.length/8));state.previewPage=Math.min(pages,state.previewPage+1);renderTeacher()});document.querySelectorAll('[data-answer]').forEach(sel=>sel.addEventListener('change',()=>{const item=state.preview.find(x=>String(x.number)===String(sel.dataset.answer));if(item){item.correct_option=sel.value||null;renderTeacher()}}));document.getElementById('importBtn')?.addEventListener('click',importPreview);}
function teacherDash(){app.innerHTML=shell('Teacher Dashboard',`Welcome, ${profile.full_name||'Teacher'} · ${profile.user_code||''}`,`${navTeacher()}<section class="stats"><div class="card stat"><div class="label">Questions</div><strong>${state.teacher.questions.length}</strong></div><div class="card stat"><div class="label">Tests</div><strong>${state.teacher.tests.length}</strong></div><div class="card stat"><div class="label">Students</div><strong>${state.teacher.students.length}</strong></div><div class="card stat"><div class="label">Submitted Attempts</div><strong>${state.teacher.reports.length}</strong></div></section><section class="card" style="margin-top:14px"><div class="row space"><div><h2>Teacher Control Center</h2><p class="muted">Build the complete exam workflow from one place.</p></div>${btn('Import Questions','goImport')}</div><div class="grid3" style="margin-top:14px"><div class="notice"><b>Question Bank</b><br><span class="muted">Only approved questions become permanent records.</span></div><div class="notice"><b>Test Builder</b><br><span class="muted">Choose exact questions, marks, timing and students.</span></div><div class="notice"><b>Reports</b><br><span class="muted">Keep every submitted attempt and mistake history.</span></div></div></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('goImport').onclick=()=>{state.tab='import';renderTeacher()};document.getElementById('logoutBtn').onclick=logout;}
function qImg(path){return sb.storage.from('question-assets').getPublicUrl(path).data.publicUrl}
function teacherQuestions(){const rows=state.teacher.questions.map((q,i)=>`<tr><td>${i+1}</td><td>${esc(q.source_question_number||'')}</td><td>${(q.question_image_paths||[]).length?`<img class="thumb" src="${qImg(q.question_image_paths[0])}" alt="Question ${esc(q.source_question_number||'')}">`:'Text'}</td><td>${esc((q.question_text||'').slice(0,260))}</td><td><span class="badge good">Stored</span></td><td><button class="btn danger sm" id="d_${q.id}">Delete</button></td></tr>`).join('');app.innerHTML=shell('Question Bank',`${state.teacher.questions.length} question(s) stored`,`${navTeacher()}<section class="card"><div class="row space"><div><h2>Questions</h2><p class="muted">Only question content and the private answer key are stored.</p></div>${btn('Import Questions','qImport')}</div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>#</th><th>Question No.</th><th>Preview</th><th>Question</th><th>Status</th><th>Manage</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">No questions found.</td></tr>'}</tbody></table></div></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('qImport').onclick=()=>{state.tab='import';renderTeacher()};document.getElementById('logoutBtn').onclick=logout;state.teacher.questions.forEach(q=>document.getElementById('d_'+q.id)?.addEventListener('click',async()=>{if(!confirm(`Delete question ${q.source_question_number||''}?`))return;const r=await sb.from('questions').delete().eq('id',q.id);if(r.error){alert(r.error.message);return;}const paths=q.question_image_paths||[];if(paths.length)await sb.storage.from('question-assets').remove(paths);await renderTeacher();}));}
function teacherImport(){app.innerHTML=shell('Import Questions','PDF-first import that preserves each question visually',`${navTeacher()}<section class="card"><div class="notice"><b>Recommended workflow:</b> upload the question PDF and, when available, the separate answer-key PDF. The system creates a visual crop for each question so equations, tables and diagrams stay formatted. PDF headers, footers, section labels and institute names are excluded from the question crop.</div><div class="grid2" style="margin-top:14px"><label class="field"><span>Question PDF</span><input id="qPdf" type="file" accept="application/pdf"></label><label class="field"><span>Answer Key PDF (optional)</span><input id="aPdf" type="file" accept="application/pdf"></label><label class="field"><span>Question range (optional)</span><input id="range" placeholder="Example: 91-180"></label><label class="field"><span>Answer handling</span><select id="answerPolicy"><option value="verified">Import only verified answers</option><option value="pending">Allow pending answers for teacher completion</option></select></label></div><div class="row" style="margin-top:14px">${btn('Analyze PDF','analyze')}</div><div id="importStatus" style="margin-top:12px"></div></section>${state.preview.length?previewUI():''}`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;document.getElementById('analyze').onclick=analyzePdf;}
function parseRange(v){if(!v)return null;const m=v.trim().match(/^(\d+)\s*[-–]\s*(\d+)$/);return m?{min:+m[1],max:+m[2]}:null;}
function previewUI(){const total=state.preview.length,matched=state.preview.filter(x=>x.correct_option).length,pending=total-matched,visual=state.preview.filter(x=>x.imageData).length,pages=Math.max(1,Math.ceil(total/8)),start=(state.previewPage-1)*8,items=state.preview.slice(start,start+8),policy=state.lastPolicy||'verified';return `<section class="card" style="margin-top:14px"><div class="kpis"><div class="kpi"><b>Detected</b><br>${total}</div><div class="kpi"><b>Answers matched</b><br>${matched}</div><div class="kpi"><b>Pending</b><br>${pending}</div><div class="kpi"><b>Visual crops</b><br>${visual}/${total}</div></div><div class="success" style="margin-top:12px">Nothing is imported yet. This is a teacher review only.</div><div class="row space" style="margin-top:14px"><div><b>Questions ${start+1}–${Math.min(start+items.length,total)} of ${total}</b></div><div class="row">${btn('← Previous','prevP','secondary',state.previewPage===1?'disabled':'')}${btn('Next →','nextP','secondary',state.previewPage===pages?'disabled':'')}</div></div><div class="preview-grid" style="margin-top:12px">${items.map(x=>`<article class="preview-card"><div class="preview-toolbar"><b>Question ${esc(x.number)}</b>${x.correct_option?`<span class="badge good">Answer ${x.correct_option}</span>`:`<span class="badge warnb">Answer Pending</span>`}</div><img class="preview-img" src="${x.imageData}" alt="Question ${esc(x.number)}"><div class="small muted" style="margin-top:9px">${x.text?esc(x.text.slice(0,420)):'Visual question — the image is the source of truth.'}</div>${!x.correct_option?`<div style="margin-top:9px"><label class="field" style="max-width:180px"><span>Teacher answer</span><select data-answer="${x.number}"><option value="">Pending</option>${['A','B','C','D'].map(a=>`<option value="${a}">${a}</option>`).join('')}</select></label></div>`:''}</article>`).join('')}</div><div class="sticky-actions row space"><div class="small muted">Import only after checking the complete preview. Policy: ${policy==='verified'?'verified answers only':'pending answers allowed'}.</div>${btn(`Import ${total} Questions`,'importBtn', 'primary', policy==='verified'&&pending>0?'disabled':'')}</div></section>`}
async function analyzePdf(){const msg=document.getElementById('importStatus'),qf=document.getElementById('qPdf').files[0],af=document.getElementById('aPdf').files[0],range=parseRange(document.getElementById('range').value);state.lastPolicy=document.getElementById('answerPolicy').value;if(!qf){msg.innerHTML='<div class="error">Please choose a question PDF.</div>';return;}msg.innerHTML='<div class="notice">Reading the PDFs locally… No files are uploaded to the server during analysis.</div>';try{const answers=af?await parseAnswerPdf(af):new Map();state.preview=await extractQuestionCrops(qf,answers,range);state.previewPage=1;if(!state.preview.length)throw new Error('No numbered questions were detected.');renderTeacher();}catch(e){msg.innerHTML=`<div class="error">${esc(e.message||String(e))}</div>`;}}
async function parseAnswerPdf(file){const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let raw='';for(let p=1;p<=doc.numPages;p++){const tc=await (await doc.getPage(p)).getTextContent();raw+=' '+tc.items.map(i=>i.str).join(' ');}const map=new Map();const re=/QUES\s+([0-9\s]+?)\s+ANS\s+([ABCD1234\s]+?)(?=QUES\s+|$)/gi;for(const m of raw.matchAll(re)){const nums=m[1].trim().split(/\s+/).map(Number),vals=m[2].trim().split(/\s+/);nums.forEach((n,i)=>{const a=vals[i];if(a)map.set(n,convertAnswer(a));});}return map;}
function convertAnswer(v){v=String(v).toUpperCase();return ({'1':'A','2':'B','3':'C','4':'D'})[v]||(['A','B','C','D'].includes(v)?v:null)}
function itemTop(it,pageHeight,scale){return (pageHeight-(it.transform[5]+(it.height||10)))*scale;}
function itemBottom(it,pageHeight,scale){return (pageHeight-it.transform[5])*scale;}
function qStarts(items,pageHeight,scale){const seen=new Set(),arr=[];for(const it of items){const m=String(it.str||'').trim().match(/^(\d{1,3})\.$/);if(!m)continue;const n=+m[1];if(seen.has(n))continue;seen.add(n);arr.push({number:n,top:itemTop(it,pageHeight,scale),bottom:itemBottom(it,pageHeight,scale),x:it.transform[4]*scale});}return arr.sort((a,b)=>a.top-b.top);}
function metadataBoundary(items,pageHeight,scale,start){let b=null;for(const it of items){const s=String(it.str||'');const top=itemTop(it,pageHeight,scale);if(top<=start)continue;if(top>start+20&&(/NPT-\d|Radiant|Academy|SECTION|CORPORATE|Website|E-mail|Mob\.No\.|Maximum Marks|INSTRUCTIONS/i.test(s)))b=b===null?top:Math.min(b,top);}return b;}
function cleanAuxText(items,topPx,bottomPx,pageHeight,scale){return items.filter(it=>{const t=itemTop(it,pageHeight,scale),b=itemBottom(it,pageHeight,scale);return b>=topPx&&t<=bottomPx;}).map(it=>it.str).join(' ').replace(/NPT-\S+/gi,'').replace(/The Radiant Academy/gi,'').replace(/SECTION\s*[-–]?\s*C\s*\(BIOLOGY\)/gi,'').replace(/\s+/g,' ').trim();}
async function extractQuestionCrops(file,answers,range){const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=[],scale=1.7;for(let p=1;p<=doc.numPages;p++){const page=await doc.getPage(p),base=page.getViewport({scale:1}),vp=page.getViewport({scale}),tc=await page.getTextContent(),starts=qStarts(tc.items,base.height,scale);if(!starts.length)continue;const canvas=document.createElement('canvas');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;for(let i=0;i<starts.length;i++){const cur=starts[i];if(range&&(cur.number<range.min||cur.number>range.max))continue;const next=starts[i+1];const top=Math.max(0,cur.top-7);let bottom=next?Math.max(top+20,next.top-7):vp.height-35;const footer=metadataBoundary(tc.items,base.height,scale,top);if(footer!==null)bottom=Math.min(bottom,footer-7);bottom=Math.min(bottom,vp.height);if(bottom-top<25)continue;const crop=document.createElement('canvas');crop.width=canvas.width;crop.height=Math.max(1,Math.ceil(bottom-top));crop.getContext('2d').drawImage(canvas,0,top,canvas.width,bottom-top,0,0,crop.width,crop.height);const imageData=crop.toDataURL('image/png');const text=cleanAuxText(tc.items,top,bottom,base.height,scale).replace(new RegExp('^'+cur.number+'\\.\\s*'),'').trim();out.push({number:cur.number,page:p,imageData,text:text||'',correct_option:answers.get(cur.number)||null});}}return out.sort((a,b)=>a.number-b.number);}
function bindPreview(){document.getElementById('prevP')?.addEventListener('click',()=>{state.previewPage--;renderTeacher();});document.getElementById('nextP')?.addEventListener('click',()=>{state.previewPage++;renderTeacher();});document.querySelectorAll('[data-answer]').forEach(sel=>sel.onchange=()=>{const n=+sel.dataset.answer,found=state.preview.find(x=>x.number===n);if(found)found.correct_option=sel.value||null;renderTeacher();});document.getElementById('importBtn')?.addEventListener('click',importPreview);}
async function importPreview(){const missing=state.preview.filter(x=>!x.correct_option);if(missing.length&&state.lastPolicy==='verified'){alert(`${missing.length} question(s) do not have verified answers yet.`);return;}const button=document.getElementById('importBtn');if(button){button.disabled=true;button.textContent='Importing…';}let done=0;for(const x of state.preview){if(!x.correct_option)continue;const ins=await sb.from('questions').insert({source_question_number:String(x.number),question_text:x.text||`Question ${x.number}`,option_a:'A',option_b:'B',option_c:'C',option_d:'D',question_image_paths:[],display_mode:'image',marks:4,negative_marks:1,created_by:profile.id,is_active:true}).select('id').single();if(ins.error){alert(`Question ${x.number} failed: ${ins.error.message}`);return;}const path=`${profile.id}/${ins.data.id}.png`;const blob=await (await fetch(x.imageData)).blob();const up=await sb.storage.from('question-assets').upload(path,blob,{contentType:'image/png',upsert:true});if(up.error){alert(`Question ${x.number} image upload failed: ${up.error.message}`);return;}const uq=await sb.from('questions').update({question_image_paths:[path]}).eq('id',ins.data.id);if(uq.error){alert(uq.error.message);return;}const qa=await sb.from('question_answers').upsert({question_id:ins.data.id,correct_option:x.correct_option,explanation:null},{onConflict:'question_id'});if(qa.error){alert(`Question ${x.number} answer save failed: ${qa.error.message}`);return;}done++;}state.preview=[];state.previewPage=1;alert(`Imported ${done} question(s) successfully.`);state.tab='questions';await renderTeacher();}
function teacherTests(){const qs=state.teacher.questions,students=state.teacher.students;if(!qs.length||!students.length){app.innerHTML=shell('Create Test','Build and assign tests',`${navTeacher()}<section class="card"><div class="notice">${!qs.length?'Add verified questions first. ':''}${!students.length?'No student accounts are available.':''}</div></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;return;}const list=qs.map(q=>`<label class="pick"><input type="checkbox" class="tq" value="${q.id}"><div><b>Question ${esc(q.source_question_number||'')}</b><div class="small muted">${esc((q.question_text||'').slice(0,220))}</div></div>${(q.question_image_paths||[]).length?'<span class="badge good">Visual</span>':''}</label>`).join('');app.innerHTML=shell('Create & Assign Test','Choose the exact questions, timing and students',`${navTeacher()}<section class="card"><div class="grid2"><label class="field"><span>Test title</span><input id="ttitle" placeholder="Biology Mock Test 01"></label><label class="field"><span>Duration (minutes)</span><input id="tdur" type="number" min="1" value="180"></label><label class="field"><span>Marks per correct</span><input id="tmarks" type="number" min="0" step="0.25" value="4"></label><label class="field"><span>Negative marks per wrong</span><input id="tneg" type="number" min="0" step="0.25" value="1"></label><label class="field"><span>Assign to students</span><select id="tstudents" multiple size="4">${students.map(s=>`<option value="${s.id}">${esc(s.full_name||'Student')} · ${esc(s.user_code||'')}</option>`).join('')}</select></label><label class="field"><span>Instructions</span><textarea id="tinstructions" placeholder="Instructions for candidates"></textarea></label></div><div class="row" style="margin-top:14px"><input id="tsearch" placeholder="Search questions" style="flex:1;padding:10px 11px;border:1px solid #cbd8ea;border-radius:10px">${btn('Select all','selAll','secondary')}${btn('Clear','selClear','secondary')}</div><div class="row space" style="margin-top:12px"><h3>Select Questions <span id="selCount">0</span> / ${qs.length}</h3><span class="badge good">Verified answers only</span></div><div class="pick-list" id="pickList">${list}</div><div class="row" style="margin-top:14px">${btn('Create & Assign Test','createTestBtn')}</div><p id="testMsg" class="muted small"></p></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;document.getElementById('tsearch').oninput=e=>document.querySelectorAll('#pickList .pick').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'grid':'none');document.getElementById('selAll').onclick=()=>{document.querySelectorAll('.tq').forEach(x=>x.checked=true);document.getElementById('selCount').textContent=document.querySelectorAll('.tq:checked').length};document.getElementById('selClear').onclick=()=>{document.querySelectorAll('.tq').forEach(x=>x.checked=false);document.getElementById('selCount').textContent='0'};document.querySelectorAll('.tq').forEach(x=>x.onchange=()=>document.getElementById('selCount').textContent=document.querySelectorAll('.tq:checked').length);document.getElementById('createTestBtn').onclick=createTest;}
async function createTest(){const msg=document.getElementById('testMsg'),title=document.getElementById('ttitle').value.trim(),duration=+document.getElementById('tdur').value,marks=+document.getElementById('tmarks').value,neg=+document.getElementById('tneg').value,students=[...document.getElementById('tstudents').selectedOptions].map(o=>o.value),qids=[...document.querySelectorAll('.tq:checked')].map(x=>x.value);if(!title||!duration||!qids.length||!students.length){msg.textContent='Enter test details, select questions and select at least one student.';return;}msg.textContent='Creating test…';const ins=await sb.from('tests').insert({title,description:document.getElementById('tinstructions').value.trim(),duration_minutes:duration,default_marks:marks,default_negative_marks:neg,is_published:true,created_by:profile.id}).select('id').single();if(ins.error){msg.textContent=ins.error.message;return;}const tqs=qids.map((qid,i)=>({test_id:ins.data.id,question_id:qid,question_order:i+1,marks,negative_marks:neg}));let r=await sb.from('test_questions').insert(tqs);if(r.error){await sb.from('tests').delete().eq('id',ins.data.id);msg.textContent=r.error.message;return;}r=await sb.from('test_assignments').insert(students.map(s=>({test_id:ins.data.id,student_id:s,assigned_by:profile.id,status:'assigned'})));if(r.error){msg.textContent=r.error.message;return;}msg.textContent='Test created and assigned successfully.';await renderTeacher();}
function teacherStudents(){const rows=state.teacher.students.map(s=>`<tr><td>${esc(s.user_code||'')}</td><td>${esc(s.full_name||'Student')}</td><td>Active</td></tr>`).join('');app.innerHTML=shell('Students','Teacher-visible student list',`${navTeacher()}<section class="card"><div class="table-wrap"><table><thead><tr><th>Student ID</th><th>Name</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="empty">No students found.</td></tr>'}</tbody></table></div></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;}
function teacherReports(){const rows=state.teacher.reports.map(r=>`<tr><td>${esc(r.student_code||'')}</td><td>${esc(r.student_name||'')}</td><td>${esc(r.test_title||'')}</td><td>${num(r.score)}/${num(r.total_marks)}</td><td>${r.correct_count}</td><td>${r.wrong_count}</td><td>${r.skipped_count}</td><td>${num(r.accuracy)}%</td><td>${fmt(r.submitted_at)}</td></tr>`).join('');app.innerHTML=shell('Performance Reports','Every submitted attempt is retained',`${navTeacher()}<section class="card"><div class="table-wrap"><table><thead><tr><th>Student</th><th>Name</th><th>Test</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Accuracy</th><th>Submitted</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">No submitted attempts yet.</td></tr>'}</tbody></table></div></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;}
function teacherAccount(){app.innerHTML=shell('My Account','Teacher account',`${navTeacher()}<section class="card"><h2>${esc(profile.full_name||'Teacher')}</h2><p class="muted">Teacher ID: <b>${esc(profile.user_code||'')}</b></p><p class="muted">Email: <b>${esc(user.email||'')}</b></p><div class="notice" style="margin-top:14px">Password changes should be handled through Supabase Auth's secure reset/change flow.</div></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;}
async function renderStudent(){const [tr,pr]=await Promise.all([sb.rpc('get_student_tests'),sb.from('my_progress').select('*').order('submitted_at',{ascending:false})]);state.student.tests=tr.data||[];state.student.progress=pr.data||[];if(state.tab==='exam')return renderExam();if(state.tab==='tests')studentTests();else if(state.tab==='progress')studentProgress();else if(state.tab==='account')studentAccount();else studentDash();bindNav();}
function studentDash(){const p=state.student.progress,total=p.reduce((a,b)=>a+(+b.total_questions||0),0),correct=p.reduce((a,b)=>a+(+b.correct_count||0),0),wrong=p.reduce((a,b)=>a+(+b.wrong_count||0),0),acc=total?Math.round(correct/total*1000)/10:0;app.innerHTML=shell('Student Dashboard',`Welcome, ${profile.full_name||'Student'} · ${profile.user_code||''}`,`${navStudent()}<section class="stats"><div class="card stat"><div class="label">Tests Taken</div><strong>${p.length}</strong></div><div class="card stat"><div class="label">Correct</div><strong>${correct}</strong></div><div class="card stat"><div class="label">Wrong</div><strong>${wrong}</strong></div><div class="card stat"><div class="label">Accuracy</div><strong>${acc}%</strong></div></section><section class="card" style="margin-top:14px"><h2>My Progress</h2><div class="progress"><span style="width:${acc}%"></span></div><p class="muted small">Only your own history and performance are visible in this account.</p></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;}
function studentTests(){const cards=state.student.tests.map(t=>`<article class="card"><div class="row space"><div><h3>${esc(t.title)}</h3><p class="muted">${t.question_count} questions · ${t.duration_minutes} minutes</p></div>${t.completed?'<span class="badge good">Completed</span>':'<span class="badge warnb">Assigned</span>'}</div><div class="row" style="margin-top:12px">${!t.completed?btn('Start Test','start_'+t.id):btn('View Result','res_'+t.id,'secondary')}</div></article>`).join('');app.innerHTML=shell('My Tests','Assigned tests and completed test history',`${navStudent()}<section class="grid2">${cards||'<section class="card empty">No tests assigned yet.</section>'}</section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;state.student.tests.forEach(t=>{document.getElementById('start_'+t.id)?.addEventListener('click',()=>startTest(t.id));document.getElementById('res_'+t.id)?.addEventListener('click',()=>showStudentResult(t.id));});}
function studentProgress(){const rows=state.student.progress.map(p=>`<tr><td>${esc(p.test_title||'')}</td><td>${num(p.score)}/${num(p.total_marks)}</td><td>${p.correct_count}</td><td>${p.wrong_count}</td><td>${p.skipped_count}</td><td>${num(p.accuracy)}%</td><td>${fmt(p.submitted_at)}</td></tr>`).join('');app.innerHTML=shell('My Progress','Your complete past-test performance',`${navStudent()}<section class="card"><div class="table-wrap"><table><thead><tr><th>Test</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Accuracy</th><th>Submitted</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No completed tests yet.</td></tr>'}</tbody></table></div></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;}
function studentAccount(){app.innerHTML=shell('My Account','Student account',`${navStudent()}<section class="card"><h2>${esc(profile.full_name||'Student')}</h2><p class="muted">Student ID: <b>${esc(profile.user_code||'')}</b></p><p class="muted">Email: <b>${esc(user.email||'')}</b></p></section>`,btn('Logout','logoutBtn','secondary'));document.getElementById('logoutBtn').onclick=logout;}
async function startTest(testId){const {data:assignment,error:ae}=await sb.from('test_assignments').select('id').eq('test_id',testId).eq('student_id',profile.id).single();if(ae||!assignment){alert('This test is not assigned to your account.');return;}let {data:attempt}=await sb.from('attempts').select('id,started_at').eq('test_id',testId).eq('student_id',profile.id).is('submitted_at',null).maybeSingle();if(!attempt){const ins=await sb.from('attempts').insert({assignment_id:assignment.id,student_id:profile.id,test_id:testId,total_questions:0}).select('id,started_at').single();if(ins.error){alert(ins.error.message);return;}attempt=ins.data;}const {data:qs,error}=await sb.rpc('get_student_test_questions',{p_test_id:testId});if(error){alert(error.message);return;}const {data:t}=await sb.from('tests').select('id,title,duration_minutes').eq('id',testId).single();const {data:saved}=await sb.from('attempt_answers').select('question_id,selected_option,marked_for_review').eq('attempt_id',attempt.id);const answers={},marked={};for(const x of saved||[]){answers[x.question_id]=x.selected_option;marked[x.question_id]=!!x.marked_for_review;}state.attempt={id:attempt.id,title:t.title,duration:t.duration_minutes,questions:qs||[],answers,marked,index:0,startedAt:attempt.started_at};state.tab='exam';renderStudent();}
function renderExam(){clearInterval(timer);const a=state.attempt;if(!a){state.tab='dashboard';return renderStudent();}const q=a.questions[a.index];const img=(q.question_image_paths||[])[0];app.innerHTML=`${top(btn('Submit Test','submitExamTop','danger'))}<main class="container"><div class="exam-top"><div class="row space"><div><b>${esc(a.title)}</b><div class="muted small">Question ${a.index+1} of ${a.questions.length}</div></div><div id="timer" class="timer">--:--</div></div></div><div class="exam-grid"><section class="card"><div class="small muted">Question ${esc(q.question_order||a.index+1)}</div>${img?`<img class="exam-image" style="margin-top:10px" src="${qImg(img)}" alt="Question">`:`<div class="notice" style="margin-top:10px">Question image unavailable.</div>`}<div class="answer-grid">${['A','B','C','D'].map(c=>`<button class="ans-btn ${a.answers[q.id]===c?'selected':''}" data-choice="${c}">${c}</button>`).join('')}</div><div class="row" style="margin-top:16px"><button class="btn secondary" id="prev" ${a.index===0?'disabled':''}>Previous</button><button class="btn secondary" id="clear">Clear</button><button class="btn warn" id="mark">${a.marked[q.id]?'Unmark Review':'Mark for Review'}</button><button class="btn primary" id="next">${a.index===a.questions.length-1?'Submit':'Save & Next'}</button></div></section><aside class="card"><h3>Question Palette</h3><div class="palette">${a.questions.map((x,i)=>`<button class="qnum ${a.answers[x.id]?'answered':''} ${a.marked[x.id]?'review':''} ${i===a.index?'current':''}" data-i="${i}">${i+1}</button>`).join('')}</div><p class="muted small" style="margin-top:10px">Green = answered · underline = review</p></aside></div></main>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>setExamAnswer(q.id,b.dataset.choice));document.getElementById('prev').onclick=()=>{a.index--;renderExam()};document.getElementById('clear').onclick=()=>setExamAnswer(q.id,null);document.getElementById('mark').onclick=async()=>{a.marked[q.id]=!a.marked[q.id];await syncAnswer(q.id);renderExam()};document.getElementById('next').onclick=()=>a.index===a.questions.length-1?submitExam(): (a.index++,renderExam());document.getElementById('submitExamTop').onclick=submitExam;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{a.index=+b.dataset.i;renderExam()});timer=setInterval(()=>updateTimer(a),1000);updateTimer(a);}
async function setExamAnswer(qid,value){const a=state.attempt;if(value===null)delete a.answers[qid];else a.answers[qid]=value;await syncAnswer(qid);renderExam();}
async function syncAnswer(qid){const a=state.attempt;const payload={attempt_id:a.id,question_id:qid,selected_option:a.answers[qid]||null,marked_for_review:!!a.marked[qid],answered_at:new Date().toISOString()};const {error}=await sb.from('attempt_answers').upsert(payload,{onConflict:'attempt_id,question_id'});if(error)alert(error.message);}
async function submitExam(){if(!confirm('Submit this test now?'))return;clearInterval(timer);const {data,error}=await sb.rpc('submit_attempt',{p_attempt_id:state.attempt.id});if(error){alert(error.message);return;}const summary=`Score: ${num(data.score)}/${num(data.total_marks)}\nCorrect: ${data.correct}\nWrong: ${data.wrong}\nSkipped: ${data.skipped}\nAccuracy: ${num(data.accuracy)}%`;state.attempt=null;state.tab='tests';await renderStudent();alert(`Test submitted successfully.\n\n${summary}`);}
function updateTimer(a){const left=Math.max(0,a.duration*60000-(Date.now()-new Date(a.startedAt).getTime())),s=Math.floor(left/1000),m=Math.floor(s/60),sec=s%60,el=document.getElementById('timer');if(el)el.textContent=`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;if(left<=0){clearInterval(timer);submitExam();}}
async function showStudentResult(testId){const p=state.student.progress.find(x=>x.test_id===testId);if(!p){alert('No completed result found.');return;}const {data:rows,error}=await sb.rpc('get_student_attempt_report',{p_attempt_id:p.attempt_id});if(error){alert(error.message);return;}const html=`<div class="kpis"><div class="kpi"><b>Score</b><br>${num(p.score)}/${num(p.total_marks)}</div><div class="kpi"><b>Correct</b><br>${p.correct_count}</div><div class="kpi"><b>Wrong</b><br>${p.wrong_count}</div><div class="kpi"><b>Skipped</b><br>${p.skipped_count}</div></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Q</th><th>Your Answer</th><th>Status</th></tr></thead><tbody>${(rows||[]).map(r=>`<tr><td>${esc(r.question_number||'')}</td><td>${esc(r.selected_option||'Skipped')}</td><td>${r.status==='correct'?'<span class="badge good">Correct</span>':r.status==='wrong'?'<span class="badge badb">Wrong</span>':'<span class="badge warnb">Skipped</span>'}</td></tr>`).join('')}</tbody></table></div>`;document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="studentResult"><div class="modal"><div class="row space"><h2>${esc(p.test_title)}</h2><button class="btn secondary" id="closeSR">Close</button></div>${html}</div></div>`);document.getElementById('closeSR').onclick=()=>document.getElementById('studentResult')?.remove();}
boot();
const origRenderTeacher=renderTeacher;renderTeacher=async()=>{await origRenderTeacher();bindPreview();};
</script>
